    <style>
      #dc-first-paint-shell { min-height: 100vh; background: #f8fafc; color: #111827; font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      #dc-first-paint-shell[hidden] { display: none; }
      .dc-shell-nav { height: 56px; display: flex; align-items: center; padding: 0 16px; border-bottom: 1px solid #e5e7eb; background: #fff; }
      .dc-shell-logo { font-size: 22px; font-weight: 900; color: #111827; }
      .dc-shell-logo span { color: #f97316; }
      .dc-shell-search-row { height: 56px; box-sizing: border-box; padding: 7px 16px; border-bottom: 1px solid #e5e7eb; background: #fff; }
      .dc-shell-search { height: 40px; border: 1px solid #dbe2ea; border-radius: 16px; background: #fff; }
      .dc-shell-hero { box-sizing: border-box; min-height: 650px; padding: 32px 16px 48px; background: linear-gradient(118deg,#fff7f1 0%,#f8fbff 48%,#eef5ff 100%); }
      .dc-shell-copy { max-width: 800px; }
      .dc-shell-badge { display: inline-flex; align-items: center; min-height: 28px; padding: 0 12px; border: 1px solid #fed7aa; border-radius: 999px; background: #fff7ed; color: #ea580c; font-size: 11px; font-weight: 800; text-transform: uppercase; }
      .dc-shell-ai { margin: 12px 0 0; color: #64748b; font-size: 14px; font-weight: 600; }
      .dc-shell-title { max-width: 760px; margin: 20px 0 0; font-size: 40px; line-height: 1.02; letter-spacing: 0; font-weight: 900; }
      .dc-shell-title strong { color: #3257d2; }
      .dc-shell-description { max-width: 680px; margin: 20px 0 0; color: #475569; font-size: 14px; line-height: 24px; font-weight: 500; }
      .dc-shell-hero-search { max-width: 672px; height: 54px; margin-top: 20px; border: 1px solid #e2e8f0; border-radius: 999px; background: #fff; box-shadow: 0 10px 40px -20px rgba(50,87,210,.32); }
      @media (min-width: 768px) {
        .dc-shell-nav { height: 72px; padding: 0 max(24px, calc((100vw - 1280px) / 2)); }
        .dc-shell-search-row { height: 60px; padding: 8px max(24px, calc((100vw - 1280px) / 2)); }
        .dc-shell-search { height: 44px; }
        .dc-shell-hero { min-height: 720px; padding: 56px max(24px, calc((100vw - 1280px) / 2)); }
        .dc-shell-title { font-size: 68px; }
        .dc-shell-description { font-size: 18px; line-height: 32px; }
      }
      @media (min-width: 1024px) { .dc-shell-title { font-size: 86px; } }
    </style>

        }

    </script>

    <!-- Website Schema with SearchAction -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebSite",
        "name": "DekhoCampus",
        "url": "https://dekhocampus.com",
        "potentialAction": {
          "@type": "SearchAction",
          "target": "https://dekhocampus.com/colleges?q={search_term_string}",
          "query-input": "required name=search_term_string"
        }
      }
    </script>

      </div>

      (() => {

        if (location.pathname === "/") shell.hidden = false;
        else shell.remove();
