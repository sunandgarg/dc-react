name: AWS production diagnostics

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  diagnostics:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION || 'ap-south-1' }}

      - name: Collect ECS deployment diagnostics
        run: |
          set +e
          aws cloudformation describe-stacks --stack-name dc-react-production --query 'Stacks[0].StackStatus' --output text
          aws ecs list-tasks --cluster dc-react-production --desired-status STOPPED --output text
          aws ecs describe-tasks --cluster dc-react-production --tasks $(aws ecs list-tasks --cluster dc-react-production --desired-status STOPPED --query 'taskArns' --output text) --output json
          aws logs tail /ecs/dc-react/api --since 45m --format short
