name: AWS production diagnostics

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  diagnostics:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION || 'ap-south-1' }}

      - name: Show failed production diagnostics
        run: |
          set +e
          echo "::group::CloudFormation stack"
          aws cloudformation describe-stacks --stack-name dc-react-production --query 'Stacks[0].StackStatus' --output text
          aws cloudformation describe-stack-events --stack-name dc-react-production --max-items 30 --query 'StackEvents[].{Time:Timestamp,Logical:LogicalResourceId,Status:ResourceStatus,Reason:ResourceStatusReason}' --output table
          echo "::endgroup::"

          echo "::group::ECS clusters"
          aws ecs list-clusters --output table
          echo "::endgroup::"

          echo "::group::Stopped task details"
          CLUSTER_ARN="$(aws ecs list-clusters --query 'clusterArns[?contains(@, `dc-react`)] | [0]' --output text)"
          echo "cluster=$CLUSTER_ARN"
          TASKS="$(aws ecs list-tasks --cluster "$CLUSTER_ARN" --desired-status STOPPED --query 'taskArns' --output text)"
          echo "tasks=$TASKS"
          if [ -n "$TASKS" ] && [ "$TASKS" != "None" ]; then
            aws ecs describe-tasks --cluster "$CLUSTER_ARN" --tasks $TASKS --query 'tasks[].{Task:taskArn,Last:lastStatus,Stop:stopCode,Reason:stoppedReason,Containers:containers[].{Name:name,Exit:exitCode,Reason:reason,Last:lastStatus}}' --output json
          fi
          echo "::endgroup::"

          echo "::group::API logs"
          aws logs tail /ecs/dc-react/api --since 45m --format short
          echo "::endgroup::"

          echo "::group::Web logs"
          aws logs tail /ecs/dc-react/web --since 45m --format short
          echo "::endgroup::"
