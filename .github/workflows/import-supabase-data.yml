name: Import Supabase database into AWS RDS

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  import:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 60
    steps:
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION || 'ap-south-1' }}

      - name: Run one-time database import task
        env:
          STACK: dc-react-production
          CLUSTER: dc-react-production
          SERVICE: dc-react-web-api
        run: |
          set -euo pipefail
          subnet_a="$(aws cloudformation describe-stack-resources --stack-name "$STACK" --logical-resource-id PublicSubnetA --query 'StackResources[0].PhysicalResourceId' --output text)"
          subnet_b="$(aws cloudformation describe-stack-resources --stack-name "$STACK" --logical-resource-id PublicSubnetB --query 'StackResources[0].PhysicalResourceId' --output text)"
          service_sg="$(aws cloudformation describe-stack-resources --stack-name "$STACK" --logical-resource-id ServiceSecurityGroup --query 'StackResources[0].PhysicalResourceId' --output text)"
          task_definition="$(aws ecs describe-services --cluster "$CLUSTER" --services "$SERVICE" --query 'services[0].taskDefinition' --output text)"
          task_arn="$(aws ecs run-task \
            --cluster "$CLUSTER" \
            --task-definition "$task_definition" \
            --launch-type FARGATE \
            --network-configuration "awsvpcConfiguration={subnets=[$subnet_a,$subnet_b],securityGroups=[$service_sg],assignPublicIp=ENABLED}" \
            --overrides '{"containerOverrides":[{"name":"api","command":["node","scripts/import-live-supabase.mjs"]}]}' \
            --query 'tasks[0].taskArn' \
            --output text)"
          test -n "$task_arn" && test "$task_arn" != "None"
          aws ecs wait tasks-stopped --cluster "$CLUSTER" --tasks "$task_arn"
          exit_code="$(aws ecs describe-tasks --cluster "$CLUSTER" --tasks "$task_arn" --query 'tasks[0].containers[?name==`api`].exitCode | [0]' --output text)"
          aws logs tail /ecs/dc-react/api --since 60m --format short
          test "$exit_code" = "0"
