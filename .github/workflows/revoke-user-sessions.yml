name: Revoke production user sessions

on:
  workflow_dispatch:
    inputs:
      phone:
        description: Indian mobile number whose sessions must be revoked
        required: true
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: dc-react-production-session-maintenance
  cancel-in-progress: false

env:
  AWS_REGION: ap-south-1
  STACK_NAME: dc-react-lightsail-production

jobs:
  revoke:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 10
    steps:
      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Validate request and locate production API
        env:
          REVOKE_PHONE: ${{ inputs.phone }}
        run: |
          echo "::add-mask::$REVOKE_PHONE"
          NORMALIZED=$(printf '%s' "$REVOKE_PHONE" | tr -cd '0-9')
          if [ "${#NORMALIZED}" -eq 12 ] && [[ "$NORMALIZED" == 91* ]]; then
            NORMALIZED="${NORMALIZED:2}"
          fi
          if ! [[ "$NORMALIZED" =~ ^[6-9][0-9]{9}$ ]]; then
            echo "The requested phone number is invalid."
            exit 1
          fi
          INSTANCE_NAME=$(aws cloudformation describe-stacks \
            --stack-name "$STACK_NAME" \
            --query 'Stacks[0].Outputs[?OutputKey==`ApiInstanceName`].OutputValue | [0]' \
            --output text)
          test -n "$INSTANCE_NAME"
          test "$INSTANCE_NAME" != "None"
          printf 'REVOKE_PHONE=%s\nINSTANCE_NAME=%s\n' "$NORMALIZED" "$INSTANCE_NAME" >> "$GITHUB_ENV"

      - name: Open runner-scoped SSH access
        run: |
          RUNNER_IP=$(curl -fsS https://checkip.amazonaws.com | tr -d '[:space:]')
          if ! [[ "$RUNNER_IP" =~ ^([0-9]{1,3}\.){3}[0-9]{1,3}$ ]]; then
            echo "Could not determine a valid GitHub runner IPv4 address."
            exit 1
          fi
          PORT_INFOS=$(jq -nc --arg runnerCidr "$RUNNER_IP/32" '[
            {fromPort:22,toPort:22,protocol:"tcp",cidrs:[$runnerCidr]},
            {fromPort:80,toPort:80,protocol:"tcp",cidrs:["0.0.0.0/0"],ipv6Cidrs:["::/0"]},
            {fromPort:443,toPort:443,protocol:"tcp",cidrs:["0.0.0.0/0"],ipv6Cidrs:["::/0"]}
          ]')
          aws lightsail put-instance-public-ports \
            --instance-name "$INSTANCE_NAME" \
            --port-infos "$PORT_INFOS" >/dev/null

      - name: Revoke every session and verify refresh-token state
        run: |
          aws lightsail get-instance-access-details \
            --instance-name "$INSTANCE_NAME" \
            --protocol ssh \
            --output json > /tmp/lightsail-access.json
          jq -r '.accessDetails.privateKey' /tmp/lightsail-access.json > /tmp/tempkey
          SSH_USER=$(jq -r '.accessDetails.username' /tmp/lightsail-access.json)
          SSH_IP=$(jq -r '.accessDetails.ipAddress' /tmp/lightsail-access.json)
          test -s /tmp/tempkey
          test -n "$SSH_USER"
          test -n "$SSH_IP"
          chmod 600 /tmp/tempkey
          ssh-keygen -y -f /tmp/tempkey >/dev/null
          for attempt in $(seq 1 12); do
            if ssh -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=no \
              -o ConnectTimeout=10 -i /tmp/tempkey "$SSH_USER@$SSH_IP" true; then
              break
            fi
            if [ "$attempt" -eq 12 ]; then
              echo "Could not establish temporary SSH access to the production API."
              exit 1
            fi
            sleep 5
          done
          ssh -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=no \
            -i /tmp/tempkey "$SSH_USER@$SSH_IP" "sudo bash -s -- '$REVOKE_PHONE'" <<'REMOTE'
          set -euo pipefail
          export REVOKE_PHONE="$1"
          set -a
          source /etc/dc-react.env
          set +a
          cd /opt/dc-react/app
          npm --prefix backend run revoke:user-sessions
          REMOTE

      - name: Close temporary SSH access
        if: ${{ always() }}
        run: |
          rm -f /tmp/tempkey /tmp/lightsail-access.json
          if [ -z "${INSTANCE_NAME:-}" ]; then
            echo "No instance was selected; no SSH rule needs cleanup."
            exit 0
          fi
          PORT_INFOS=$(jq -nc '[
            {fromPort:80,toPort:80,protocol:"tcp",cidrs:["0.0.0.0/0"],ipv6Cidrs:["::/0"]},
            {fromPort:443,toPort:443,protocol:"tcp",cidrs:["0.0.0.0/0"],ipv6Cidrs:["::/0"]}
          ]')
          aws lightsail put-instance-public-ports \
            --instance-name "$INSTANCE_NAME" \
            --port-infos "$PORT_INFOS" >/dev/null
          INSTANCE_IP=$(aws lightsail get-instance \
            --instance-name "$INSTANCE_NAME" \
            --query 'instance.publicIpAddress' \
            --output text)
          if [ -n "$INSTANCE_IP" ] && timeout 10 bash -c "</dev/tcp/$INSTANCE_IP/22" 2>/dev/null; then
            echo "Temporary SSH access is still reachable after cleanup."
            exit 1
          fi
          echo "Temporary SSH access is closed."
