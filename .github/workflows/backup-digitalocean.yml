name: Backup legacy DigitalOcean database

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backup:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: digitalocean/action-doctl@v2
        with:
          token: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}

      - name: Export MySQL without exposing credentials
        run: |
          set -euo pipefail
          CLUSTER_ID=$(doctl databases list --output json | jq -r '.[] | select(.name == "dc-react-mysql") | .id' | head -1)
          test -n "$CLUSTER_ID"
          doctl databases connection "$CLUSTER_ID" --output json > /tmp/do-connection.json
          DB_HOST=$(jq -r 'if type == "array" then .[0].host else .host end' /tmp/do-connection.json)
          DB_PORT=$(jq -r 'if type == "array" then .[0].port else .port end' /tmp/do-connection.json)
          DB_USER=$(jq -r 'if type == "array" then .[0].user else .user end' /tmp/do-connection.json)
          DB_PASSWORD=$(jq -r 'if type == "array" then .[0].password else .password end' /tmp/do-connection.json)
          DB_NAME=$(jq -r 'if type == "array" then .[0].database else .database end' /tmp/do-connection.json)
          test -n "$DB_HOST"
          test -n "$DB_PASSWORD"
          sudo apt-get update -qq
          sudo apt-get install -y -qq mysql-client
          MYSQL_PWD="$DB_PASSWORD" mysqldump \
            --host="$DB_HOST" \
            --port="$DB_PORT" \
            --user="$DB_USER" \
            --ssl-mode=REQUIRED \
            --single-transaction \
            --routines \
            --triggers \
            --events \
            --hex-blob \
            --set-gtid-purged=OFF \
            --default-character-set=utf8mb4 \
            --result-file=dc-react-digitalocean.sql \
            "$DB_NAME"
          rm -f /tmp/do-connection.json
          gzip -9 dc-react-digitalocean.sql
          test -s dc-react-digitalocean.sql.gz
          shasum -a 256 dc-react-digitalocean.sql.gz > dc-react-digitalocean.sql.gz.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: dc-react-digitalocean-backup
          path: |
            dc-react-digitalocean.sql.gz
            dc-react-digitalocean.sql.gz.sha256
          retention-days: 1
          if-no-files-found: error
