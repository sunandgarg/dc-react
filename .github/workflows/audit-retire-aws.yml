name: Audit and retire AWS

on:
  workflow_dispatch:
    inputs:
      retire_aws:
        description: Delete AWS CloudFormation stacks after count parity passes
        required: false
        type: boolean
        default: false
      confirm_retire_aws:
        description: Type RETIRE_AWS_AFTER_DIGITALOCEAN_PARITY to allow deletion
        required: false
        type: string
        default: ""

permissions:
  contents: read
  id-token: write

concurrency:
  group: dc-react-aws-retirement
  cancel-in-progress: false

env:
  AWS_REGION: ${{ vars.AWS_REGION || 'ap-south-1' }}
  PROJECT_NAME: dc-react
  DO_APP_ID: 5453d5a9-d498-426b-af43-2b3a93f0705c
  DO_DATABASE_NAME: dc-react-mysql

jobs:
  audit-and-retire:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - uses: digitalocean/action-doctl@v2
        with:
          token: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}

      - name: Locate AWS and DigitalOcean resources
        id: resources
        run: |
          set -euo pipefail
          aws sts get-caller-identity
          aws cloudformation describe-stacks \
            --query 'Stacks[?contains(StackName, `dc-react`)].{Name:StackName,Status:StackStatus,Updated:LastUpdatedTime}' \
            --output table

          INSTANCE_ID=$(aws cloudformation describe-stacks \
            --stack-name "$PROJECT_NAME-low-cost-production" \
            --query 'Stacks[0].Outputs[?OutputKey==`InstanceId`].OutputValue' \
            --output text)
          SOURCE_IP=$(aws cloudformation describe-stacks \
            --stack-name "$PROJECT_NAME-low-cost-production" \
            --query 'Stacks[0].Outputs[?OutputKey==`PublicIp`].OutputValue' \
            --output text)
          DATABASE_SECRET=$(aws cloudformation describe-stack-resource \
            --stack-name "$PROJECT_NAME-production" \
            --logical-resource-id DatabaseSecret \
            --query 'StackResourceDetail.PhysicalResourceId' \
            --output text)
          SOURCE_HOST=$(aws rds describe-db-instances \
            --db-instance-identifier "$PROJECT_NAME-mysql" \
            --query 'DBInstances[0].Endpoint.Address' \
            --output text)

          DATABASES=$(curl --fail --silent --show-error \
            -H "Authorization: Bearer ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}" \
            'https://api.digitalocean.com/v2/databases?per_page=100')
          DO_DATABASE_ID=$(jq -r --arg name "$DO_DATABASE_NAME" '.databases[]? | select(.name == $name) | .id' <<<"$DATABASES" | head -1)
          test -n "$DO_DATABASE_ID"

          echo "instance_id=$INSTANCE_ID" >> "$GITHUB_OUTPUT"
          echo "source_ip=$SOURCE_IP" >> "$GITHUB_OUTPUT"
          echo "database_secret=$DATABASE_SECRET" >> "$GITHUB_OUTPUT"
          echo "source_host=$SOURCE_HOST" >> "$GITHUB_OUTPUT"
          echo "do_database_id=$DO_DATABASE_ID" >> "$GITHUB_OUTPUT"

      - name: Compare AWS and DigitalOcean MySQL row counts
        env:
          INSTANCE_ID: ${{ steps.resources.outputs.instance_id }}
          SOURCE_IP: ${{ steps.resources.outputs.source_ip }}
          DATABASE_SECRET: ${{ steps.resources.outputs.database_secret }}
          SOURCE_HOST: ${{ steps.resources.outputs.source_host }}
          DO_DATABASE_ID: ${{ steps.resources.outputs.do_database_id }}
          DIGITALOCEAN_ACCESS_TOKEN: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          curl --fail --silent --show-error \
            -H "Authorization: Bearer $DIGITALOCEAN_ACCESS_TOKEN" \
            "https://api.digitalocean.com/v2/databases/$DO_DATABASE_ID/firewall" > /tmp/original-firewall.json
          jq -n --arg app "$DO_APP_ID" --arg ip "$SOURCE_IP" \
            '{rules:[{type:"app",value:$app},{type:"ip_addr",value:$ip}]}' > /tmp/audit-firewall.json
          curl --fail --silent --show-error -X PUT \
            -H "Authorization: Bearer $DIGITALOCEAN_ACCESS_TOKEN" \
            -H 'Content-Type: application/json' \
            --data-binary @/tmp/audit-firewall.json \
            "https://api.digitalocean.com/v2/databases/$DO_DATABASE_ID/firewall" >/dev/null
          restore_firewall() {
            jq --arg app "$DO_APP_ID" \
              '{rules: ([.rules[]? | {type,value}] + [{type:"app",value:$app}] | unique_by([.type,.value]))}' \
              /tmp/original-firewall.json > /tmp/restored-firewall.json
            curl --fail --silent --show-error -X PUT \
              -H "Authorization: Bearer $DIGITALOCEAN_ACCESS_TOKEN" \
              -H 'Content-Type: application/json' \
              --data-binary @/tmp/restored-firewall.json \
              "https://api.digitalocean.com/v2/databases/$DO_DATABASE_ID/firewall" >/dev/null
          }
          trap restore_firewall EXIT

          CONNECTION=$(curl --fail --silent --show-error \
            -H "Authorization: Bearer $DIGITALOCEAN_ACCESS_TOKEN" \
            "https://api.digitalocean.com/v2/databases/$DO_DATABASE_ID" | jq -c '.database.connection')
          export DO_HOST=$(jq -r .host <<<"$CONNECTION")
          export DO_PORT=$(jq -r .port <<<"$CONNECTION")
          export DO_USER=$(jq -r .user <<<"$CONNECTION")
          export DO_PASSWORD=$(jq -r .password <<<"$CONNECTION")
          export DO_DB=$(jq -r .database <<<"$CONNECTION")
          export SOURCE_HOST DATABASE_SECRET AWS_REGION

          python - <<'PY'
          import json
          import os
          import shlex

          names = ["AWS_REGION", "SOURCE_HOST", "DATABASE_SECRET", "DO_HOST", "DO_PORT", "DO_USER", "DO_PASSWORD", "DO_DB"]
          values = {name: shlex.quote(os.environ[name]) for name in names}
          tables = [
              "colleges", "courses", "exams", "articles", "authors", "scholarships",
              "career_profiles", "jobs", "leads", "course_fees", "content_change_reviews",
              "profiles", "app_auth_users", "user_roles", "user_permissions",
          ]
          table_sql = ",".join("'" + table + "'" for table in tables)
          script = r'''#!/usr/bin/env bash
          set -euo pipefail
          AWS_REGION={AWS_REGION}
          SOURCE_HOST={SOURCE_HOST}
          DATABASE_SECRET={DATABASE_SECRET}
          DO_HOST={DO_HOST}
          DO_PORT={DO_PORT}
          DO_USER={DO_USER}
          DO_PASSWORD={DO_PASSWORD}
          DO_DB={DO_DB}
          TABLE_SQL="{table_sql}"
          SOURCE_JSON=$(aws secretsmanager get-secret-value --region "$AWS_REGION" --secret-id "$DATABASE_SECRET" --query SecretString --output text)
          SOURCE_USER=$(jq -r .username <<<"$SOURCE_JSON")
          SOURCE_PASSWORD=$(jq -r .password <<<"$SOURCE_JSON")
          IMAGE=mysql:8.4
          docker pull "$IMAGE" >/dev/null
          SQL="SELECT table_name FROM information_schema.tables WHERE table_schema = DATABASE() AND table_name IN ($TABLE_SQL) ORDER BY table_name"
          docker run --rm --network host -e MYSQL_PWD="$SOURCE_PASSWORD" "$IMAGE" mysql -h "$SOURCE_HOST" -u "$SOURCE_USER" dc_react -Nse "$SQL" > /tmp/aws_tables.txt
          docker run --rm --network host -e MYSQL_PWD="$DO_PASSWORD" "$IMAGE" mysql --ssl-mode=REQUIRED -h "$DO_HOST" -P "$DO_PORT" -u "$DO_USER" "$DO_DB" -Nse "$SQL" > /tmp/do_tables.txt
          diff -u /tmp/aws_tables.txt /tmp/do_tables.txt
          printf 'table,aws_count,digitalocean_count\n' > /tmp/counts.csv
          while read -r table; do
            aws_count=$(docker run --rm --network host -e MYSQL_PWD="$SOURCE_PASSWORD" "$IMAGE" mysql -h "$SOURCE_HOST" -u "$SOURCE_USER" dc_react -Nse "SELECT COUNT(*) FROM \`$table\`")
            do_count=$(docker run --rm --network host -e MYSQL_PWD="$DO_PASSWORD" "$IMAGE" mysql --ssl-mode=REQUIRED -h "$DO_HOST" -P "$DO_PORT" -u "$DO_USER" "$DO_DB" -Nse "SELECT COUNT(*) FROM \`$table\`")
            printf '%s,%s,%s\n' "$table" "$aws_count" "$do_count" | tee -a /tmp/counts.csv
            test "$aws_count" = "$do_count"
          done < /tmp/aws_tables.txt
          '''.format(table_sql=table_sql, **values)
          with open("/tmp/ssm-parameters.json", "w", encoding="utf-8") as target:
              json.dump({"commands": [script]}, target)
          PY

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name AWS-RunShellScript \
            --parameters file:///tmp/ssm-parameters.json \
            --query 'Command.CommandId' \
            --output text)
          for attempt in $(seq 1 180); do
            STATUS=$(aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID" --query Status --output text 2>/dev/null || true)
            [ "$STATUS" = "Success" ] && break
            case "$STATUS" in Failed|Cancelled|TimedOut)
              aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID"
              exit 1
              ;;
            esac
            [ "$attempt" -eq 180 ] && exit 1
            sleep 5
          done
          aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID" --query 'StandardOutputContent' --output text

      - name: Retire AWS stacks after explicit confirmation
        if: ${{ inputs.retire_aws && inputs.confirm_retire_aws == 'RETIRE_AWS_AFTER_DIGITALOCEAN_PARITY' }}
        run: |
          set -euo pipefail
          aws rds modify-db-instance \
            --db-instance-identifier "$PROJECT_NAME-mysql" \
            --no-deletion-protection \
            --apply-immediately >/dev/null
          aws rds wait db-instance-available --db-instance-identifier "$PROJECT_NAME-mysql"

          aws cloudformation delete-stack --stack-name "$PROJECT_NAME-low-cost-production"
          aws cloudformation wait stack-delete-complete --stack-name "$PROJECT_NAME-low-cost-production"

          aws cloudformation delete-stack --stack-name "$PROJECT_NAME-production"
          aws cloudformation wait stack-delete-complete --stack-name "$PROJECT_NAME-production"

          for repo in "$PROJECT_NAME-api" "$PROJECT_NAME-web"; do
            aws ecr delete-repository --repository-name "$repo" --force >/dev/null 2>&1 || true
          done

          bootstrap_stack=$(aws cloudformation describe-stacks \
            --query 'Stacks[?contains(StackName, `dc-react`) && StackStatus != `DELETE_COMPLETE`].StackName' \
            --output text | tr '\t' '\n' | grep -E 'bootstrap|Bootstrap' | head -1 || true)
          if [ -n "$bootstrap_stack" ]; then
            aws cloudformation delete-stack --stack-name "$bootstrap_stack"
            aws cloudformation wait stack-delete-complete --stack-name "$bootstrap_stack"
          fi
