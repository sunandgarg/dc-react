name: AWS recover failed production stack

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  recover:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION || 'ap-south-1' }}

      - name: Delete failed production stack
        run: |
          set -euxo pipefail
          aws rds modify-db-instance \
            --db-instance-identifier dc-react-mysql \
            --no-deletion-protection \
            --apply-immediately || true
          aws rds wait db-instance-available --db-instance-identifier dc-react-mysql || true
          aws cloudformation delete-stack --stack-name dc-react-production
          aws cloudformation wait stack-delete-complete --stack-name dc-react-production
          aws logs delete-log-group --log-group-name /ecs/dc-react/api || true
          aws logs delete-log-group --log-group-name /ecs/dc-react/web || true
