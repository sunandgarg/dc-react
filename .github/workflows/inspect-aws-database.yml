name: Inspect AWS production database

on:
  workflow_dispatch:
    inputs:
      finish_public_index:
        description: Apply and measure the online public college directory ordering index
        type: boolean
        default: false
      finish_featured_index:
        description: Apply the online featured-college index and clean the isolated brochure test draft
        type: boolean
        default: false
      release_commit:
        description: Verified main commit to activate after database migration
        type: string
        default: ''
      pause_for_migration:
        description: Briefly pause API traffic while the existing migration completes
        type: boolean
        default: false
      restart_services:
        description: Restart the DekhoCampus API and nginx services
        type: boolean
        default: false
      repair_affiliation_index:
        description: Add the missing nonunique affiliation lookup index
        type: boolean
        default: false

permissions:
  contents: read
  id-token: write

env:
  AWS_REGION: ap-south-1
  DATABASE_NAME: dc-react-mysql-lightsail

jobs:
  inspect:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 30
    steps:
      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Report managed database state
        run: |
          set -euo pipefail
          aws sts get-caller-identity \
            --query '{account:Account,role:Arn}' \
            --output json
          aws lightsail get-relational-database \
            --relational-database-name "$DATABASE_NAME" \
            --query 'relationalDatabase.{name:name,state:state,engine:engine,engineVersion:engineVersion,availabilityZone:location.availabilityZone,publiclyAccessible:publiclyAccessible,pendingMaintenanceActions:pendingMaintenanceActions}' \
            --output json

      - name: Inspect database cache settings and CPU
        continue-on-error: true
        run: |
          aws lightsail get-relational-database-parameters --relational-database-name "$DATABASE_NAME" --query "parameters[?parameterName=='innodb_buffer_pool_size'].{name:parameterName,value:parameterValue,modifiable:isModifiable,applyType:applyType,allowedValues:allowedValues}" --output json
          for metric in CPUUtilization DiskQueueDepth; do
            unit=Count
            if [ "$metric" = CPUUtilization ]; then unit=Percent; fi
            aws lightsail get-relational-database-metric-data --relational-database-name "$DATABASE_NAME" --metric-name "$metric" --period 300 --start-time "$(date -u -d '20 minutes ago' +%FT%TZ)" --end-time "$(date -u +%FT%TZ)" --unit "$unit" --statistics Average --query metricData --output json
          done

      - name: Inspect API host and database workload
        run: |
          set -euo pipefail
          export REPAIR_INDEX="${{ inputs.repair_affiliation_index }}"
          RUNNER_IP=$(curl -fsS https://checkip.amazonaws.com | tr -d '[:space:]')
          [[ "$RUNNER_IP" =~ ^([0-9]{1,3}\.){3}[0-9]{1,3}$ ]]
          PORT_INFO=$(jq -nc --arg cidr "$RUNNER_IP/32" '{fromPort:22,toPort:22,protocol:"tcp",cidrs:[$cidr]}')
          trap 'aws lightsail close-instance-public-ports --instance-name dc-react-api-lightsail --port-info "$PORT_INFO" >/dev/null' EXIT
          aws lightsail open-instance-public-ports --instance-name dc-react-api-lightsail --port-info "$PORT_INFO" >/dev/null
          aws lightsail get-instance-access-details --instance-name dc-react-api-lightsail --protocol ssh > /tmp/access.json
          jq -r '.accessDetails.privateKey' /tmp/access.json > /tmp/key
          jq -r '.accessDetails.certKey' /tmp/access.json > /tmp/key-cert.pub
          chmod 600 /tmp/key
          SSH_USER=$(jq -r '.accessDetails.username' /tmp/access.json)
          SSH_IP=$(jq -r '.accessDetails.ipAddress' /tmp/access.json)
          timeout 1200 ssh -o ConnectTimeout=15 -o ServerAliveInterval=15 -o ServerAliveCountMax=2 -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=no -i /tmp/key "$SSH_USER@$SSH_IP" "sudo REPAIR_INDEX=$REPAIR_INDEX bash -s" <<'REMOTE' 
          set -euo pipefail
          if [ "${{ inputs.restart_services }}" = true ]; then
            pm2 restart dc-react-api --update-env
            systemctl restart nginx
            systemctl is-active nginx
          fi
          if [ "${{ inputs.pause_for_migration }}" = true ]; then
            trap 'pm2 restart dc-react-api --update-env >/dev/null' EXIT
            pm2 stop dc-react-api
          fi
          RELEASE_COMMIT="${{ inputs.release_commit }}"
          if [ -n "$RELEASE_COMMIT" ]; then
            [[ "$RELEASE_COMMIT" =~ ^[a-f0-9]{40}$ ]]
            cd /opt/dc-react/app
            git fetch --no-tags origin "$RELEASE_COMMIT"
            git reset --hard "$RELEASE_COMMIT"
            node --check backend/src/index.mjs
            pm2 reload dc-react-api --update-env
            pm2 save
          fi
          uptime
          free -m
          df -h /
          ps -eo comm,rss,pcpu --sort=-rss | head -12
          set -a
          source /etc/dc-react.env
          set +a
          cd /opt/dc-react/app/backend
          node --input-type=module <<'JS'
          import "./src/database-url.mjs";
          import mysql from "mysql2/promise";
          const start = Date.now();
          console.log("starting_mysql_inspection");
          const db = await mysql.createConnection(process.env.DATABASE_URL);
          console.log("mysql_connect_ms", Date.now()-start);
          if (process.env.REPAIR_INDEX === "true") {
            const [staleReads] = await db.query("SELECT ID,INFO FROM information_schema.PROCESSLIST WHERE DB=DATABASE() AND COMMAND='Execute' AND TIME>10");
            let drained=0;
            for (const row of staleReads) {
              if (/^SELECT .* FROM `colleges` /s.test(row.INFO || "")) {
                try { await db.query("KILL QUERY " + Number(row.ID)); drained++; } catch (error) { if (error.code !== "ER_NO_SUCH_THREAD") throw error; }
              }
            }
            console.log("drained_long_college_reads",drained);
            const [adminOrder] = await db.query("SHOW INDEX FROM colleges WHERE Key_name='ix_colleges_admin_order'");
            if (!adminOrder.length) {
              await db.query("CREATE INDEX ix_colleges_admin_order ON colleges (priority,featured_rank,updated_at DESC,id) ALGORITHM=INPLACE LOCK=NONE");
              console.log("admin_order_index_created");
            }
            const [existing] = await db.query("SHOW INDEX FROM colleges WHERE Key_name='ix_colleges_parent_active'");
            if (!existing.length) {
              await db.query("SET SESSION lock_wait_timeout=120");
              const monitor = await mysql.createConnection(process.env.DATABASE_URL);
              const cancelSlowReads = async () => {
                const [running] = await monitor.query("SELECT ID, INFO FROM information_schema.PROCESSLIST WHERE DB=DATABASE() AND COMMAND='Execute' AND TIME>10");
                for (const r of running) {
                  if (/^SELECT .* FROM `colleges` /s.test(r.INFO || "")) {
                    try { await monitor.query("KILL QUERY " + Number(r.ID)); } catch (e) { if (e.code !== "ER_NO_SUCH_THREAD") throw e; }
                  }
                }
              };
              await cancelSlowReads();
              let stopping = false;
              const drain = async () => {
                while (!stopping) {
                  await cancelSlowReads();
                  await new Promise(resolve=>setTimeout(resolve,2000));
                }
              };
              const draining = drain();
              try {
                await db.query("CREATE INDEX ix_colleges_parent_active ON colleges (parent_university_slug(191), is_active) ALGORITHM=INPLACE LOCK=NONE");
              } finally {
                stopping=true;
                await draining;
                await monitor.end();
              }
              console.log("affiliation_index_created");
            }
          }
          if ("${{ inputs.pause_for_migration }}" === "true") {
            for (let i=0;i<20;i++) {
              const [migration]=await db.query("SELECT TIME,STATE FROM information_schema.PROCESSLIST WHERE INFO LIKE 'ALTER TABLE `colleges` MODIFY `status`%' ");
              console.log(JSON.stringify({migration}));
              if (!migration.length) break;
              await new Promise(resolve=>setTimeout(resolve,10000));
            }
          }
          if ("${{ inputs.finish_featured_index }}" === "true") {
            const [existing]=await db.query("SHOW INDEX FROM colleges WHERE Key_name='ix_colleges_featured'");
            if (!existing.length) await db.query("CREATE INDEX ix_colleges_featured ON colleges (featured_rank) ALGORITHM=INPLACE LOCK=NONE");
            console.log("featured_index_ready");
            const start=Date.now();
            const [featured]=await db.query("SELECT id,slug,name,image,featured_rank FROM colleges WHERE featured_rank IS NOT NULL ORDER BY featured_rank ASC LIMIT 1000");
            console.log(JSON.stringify({featured_ms:Date.now()-start,rows:featured.length}));
            const [removed]=await db.query("DELETE FROM colleges WHERE slug=? AND name=? AND status='Draft'", ['dc-brochure-verification-20261112','DC brochure verification 20261112']);
            console.log("brochure_test_drafts_removed",removed.affectedRows);
          }
          if ("${{ inputs.finish_public_index }}" === "true") {
            const [existing]=await db.query("SHOW INDEX FROM colleges WHERE Key_name='ix_colleges_directory_order'");
            if (!existing.length) await db.query("CREATE INDEX ix_colleges_directory_order ON colleges (is_active,priority,featured_rank,rating DESC,id) ALGORITHM=INPLACE LOCK=NONE");
            const sql="SELECT id,slug,name,short_name,location,city,state,type,category,rating,reviews,fees,image,logo,tags,approvals,naac_grade,established,priority,featured_rank,is_partner,affiliation_kind,parent_university_slug FROM colleges WHERE is_active=1 ORDER BY priority,featured_rank,rating DESC,id LIMIT 10";
            const start=Date.now();
            const [rows]=await db.query(sql);
            const [plan]=await db.query("EXPLAIN "+sql);
            console.log(JSON.stringify({public_directory_ms:Date.now()-start,rows:rows.length,plan}));
          }
          const [active] = await db.query("SELECT ID,TIME,STATE,INFO AS shape FROM information_schema.PROCESSLIST WHERE COMMAND != 'Sleep' AND INFO IS NOT NULL");
          console.log(JSON.stringify(active.map(r=>({...r,shape:r.shape.startsWith("SELECT ") ? r.shape.replace(/'[^']*'/g,"?").slice(0,3000) : r.shape.split(" ")[0]}))));
          for (const sql of [
            "SELECT EVENT_NAME,WORK_COMPLETED,WORK_ESTIMATED FROM performance_schema.events_stages_current",
            "SELECT OBJECT_TYPE,OBJECT_NAME,LOCK_TYPE,LOCK_DURATION,LOCK_STATUS,OWNER_THREAD_ID FROM performance_schema.metadata_locks WHERE OBJECT_NAME='colleges'",
            "SHOW GLOBAL STATUS WHERE Variable_name IN ('Threads_running','Innodb_rows_inserted','Innodb_data_written')"
          ]) {
            try { const [rows]=await db.query(sql); console.log(JSON.stringify({sql,rows})); }
            catch(e) { console.log(e.code); }
          }
          await db.end();
          JS
          REMOTE
