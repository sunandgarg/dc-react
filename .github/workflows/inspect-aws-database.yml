name: Inspect AWS production database

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  AWS_REGION: ap-south-1
  DATABASE_NAME: dc-react-mysql-lightsail

jobs:
  inspect:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 10
    steps:
      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Report managed database state
        run: |
          set -euo pipefail
          aws sts get-caller-identity \
            --query '{account:Account,role:Arn}' \
            --output json
          aws lightsail get-relational-database \
            --relational-database-name "$DATABASE_NAME" \
            --query 'relationalDatabase.{name:name,state:state,engine:engine,engineVersion:engineVersion,availabilityZone:location.availabilityZone,publiclyAccessible:publiclyAccessible,pendingMaintenanceActions:pendingMaintenanceActions}' \
            --output json

      - name: Report the last hour of database load
        run: |
          set -euo pipefail
          start=$(date -u -d '1 hour ago' +%FT%TZ)
          end=$(date -u +%FT%TZ)
          for item in CPUUtilization:Percent DatabaseConnections:Count DiskQueueDepth:Count FreeStorageSpace:Bytes; do
            metric=${item%:*}
            echo "$metric (five-minute averages and peaks)"
            aws lightsail get-relational-database-metric-data \
              --relational-database-name "$DATABASE_NAME" --metric-name "$metric" \
              --start-time "$start" --end-time "$end" --period 300 --unit "${item#*:}" \
              --statistics Average Maximum --query 'sort_by(metricData,&timestamp)[*].[timestamp,average,maximum]' --output text
          done
