name: Inspect AWS production database

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  AWS_REGION: ap-south-1
  DATABASE_NAME: dc-react-mysql-lightsail

jobs:
  inspect:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 10
    steps:
      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Report managed database state
        run: |
          set -euo pipefail
          aws sts get-caller-identity \
            --query '{account:Account,role:Arn}' \
            --output json
          aws lightsail get-relational-database \
            --relational-database-name "$DATABASE_NAME" \
            --query 'relationalDatabase.{name:name,state:state,engine:engine,engineVersion:engineVersion,availabilityZone:location.availabilityZone,publiclyAccessible:publiclyAccessible,pendingMaintenanceActions:pendingMaintenanceActions}' \
            --output json

      - name: Inspect API host and database workload
        run: |
          set -euo pipefail
          RUNNER_IP=$(curl -fsS https://checkip.amazonaws.com | tr -d '[:space:]')
          [[ "$RUNNER_IP" =~ ^([0-9]{1,3}\.){3}[0-9]{1,3}$ ]]
          PORT_INFO=$(jq -nc --arg cidr "$RUNNER_IP/32" '{fromPort:22,toPort:22,protocol:"tcp",cidrs:[$cidr]}')
          trap 'aws lightsail close-instance-public-ports --instance-name dc-react-api-lightsail --port-info "$PORT_INFO" >/dev/null' EXIT
          aws lightsail open-instance-public-ports --instance-name dc-react-api-lightsail --port-info "$PORT_INFO" >/dev/null
          aws lightsail get-instance-access-details --instance-name dc-react-api-lightsail --protocol ssh > /tmp/access.json
          jq -r '.accessDetails.privateKey' /tmp/access.json > /tmp/key
          jq -r '.accessDetails.certKey' /tmp/access.json > /tmp/key-cert.pub
          chmod 600 /tmp/key
          SSH_USER=$(jq -r '.accessDetails.username' /tmp/access.json)
          SSH_IP=$(jq -r '.accessDetails.ipAddress' /tmp/access.json)
          timeout 90 ssh -o ConnectTimeout=15 -o ServerAliveInterval=15 -o ServerAliveCountMax=2 -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=no -i /tmp/key "$SSH_USER@$SSH_IP" 'sudo bash -s' <<'REMOTE'
          set -euo pipefail
          uptime
          free -m
          df -h /
          ps -eo comm,rss,pcpu --sort=-rss | head -12
          set -a
          source /etc/dc-react.env
          set +a
          cd /opt/dc-react/app/backend
          node --input-type=module <<'JS'
          import "./src/database-url.mjs";
          import mysql from "mysql2/promise";
          const start = Date.now();
          console.log("starting_mysql_inspection");
          const db = await mysql.createConnection(process.env.DATABASE_URL);
          console.log("mysql_connect_ms", Date.now()-start);
          for (const sql of [
            "SHOW GLOBAL STATUS WHERE Variable_name IN ('Threads_connected','Threads_running','Max_used_connections','Slow_queries','Aborted_connects','Innodb_buffer_pool_reads','Innodb_buffer_pool_read_requests','Uptime')",
            "SHOW VARIABLES WHERE Variable_name IN ('max_connections','innodb_buffer_pool_size')",
            "SELECT COMMAND, STATE, COUNT(*) AS connections, MAX(TIME) AS max_seconds FROM information_schema.PROCESSLIST GROUP BY COMMAND, STATE",
            "SELECT DIGEST_TEXT, COUNT_STAR, ROUND(SUM_TIMER_WAIT/1000000000000,2) AS total_seconds, ROUND(MAX_TIMER_WAIT/1000000000000,2) AS max_seconds FROM performance_schema.events_statements_summary_by_digest ORDER BY SUM_TIMER_WAIT DESC LIMIT 8",
            "EXPLAIN SELECT id,name FROM colleges WHERE name LIKE '%Delhi%' ORDER BY name,id LIMIT 20"
          ]) {
            const before=Date.now();
            const [rows]=await db.query(sql);
            console.log(JSON.stringify({sql,ms:Date.now()-before,rows}));
          }
          await db.end();
          JS
          REMOTE
