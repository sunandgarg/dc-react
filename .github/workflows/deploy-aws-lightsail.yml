          set -euo pipefail
          set -a
          source /etc/dc-react.env
          set +a
          cd /opt/dc-react/app/backend
          node --input-type=module <<'NODE'
          const { publishSitemap } = await import("./src/sitemap-publish.mjs");
          const { prisma } = await import("./src/db.mjs");
