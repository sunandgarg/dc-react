      - name: Verify private storage and API
        run: |
          BUCKET=$(jq -r '.[] | select(.OutputKey=="MediaBucketName") | .OutputValue' /tmp/stack-outputs.json)
          PUBLIC_BLOCK=$(aws s3api get-public-access-block --bucket "$BUCKET")
          jq -e '.PublicAccessBlockConfiguration | .BlockPublicAcls and .IgnorePublicAcls and .BlockPublicPolicy and .RestrictPublicBuckets' <<<"$PUBLIC_BLOCK"
          for attempt in $(seq 1 60); do
            HEALTH=$(curl --fail --silent --show-error --max-time 10 "https://aws-origin.dekhocampus.com/health" || true)
            if jq -e '.ok == true and .database == "mysql" and .storage == "s3"' <<<"$HEALTH" >/dev/null 2>&1; then break; fi
            [ "$attempt" -eq 60 ] && { echo "$HEALTH"; exit 1; }
            sleep 10
          done
          rm -f /tmp/tempkey /tmp/tempkey-cert.pub /tmp/stack-outputs.json
