name: Deploy AWS Lightsail production

on:
  workflow_dispatch:
    inputs:
      budget_email:
        description: Email address for AWS budget alerts
        required: true
        type: string
      run_ai_smoke:
        description: Run one reversible live Gemini and OpenAI cover test
        required: false
        default: false
        type: boolean
      revoke_phone:
        description: Optional Indian mobile number whose sessions must be revoked
        required: false
        default: ""
        type: string
      repair_listed_article_covers:
        description: Replace the approved list of broken article covers in AWS
        required: false
        default: false
        type: boolean

permissions:
  contents: read
  id-token: write

concurrency:
  group: dc-react-aws-lightsail-production
  cancel-in-progress: false

env:
  AWS_REGION: ap-south-1
  PROJECT_NAME: dc-react
  STACK_NAME: dc-react-lightsail-production

jobs:
  verify-provision-migrate:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Verify application
        run: |
          npm ci
          npm --prefix backend ci
          npm --prefix backend run prisma:generate
          npm test
          npm --prefix backend test
          npm run lint
          npm run build

      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Validate and deploy infrastructure
        run: |
          aws cloudformation validate-template --template-body file://infra/aws/lightsail-production.yaml >/dev/null
          if aws cloudformation describe-stacks --stack-name "$STACK_NAME" >/dev/null 2>&1; then
            STACK_STATUS=$(aws cloudformation describe-stacks --stack-name "$STACK_NAME" --query 'Stacks[0].StackStatus' --output text)
            if [ "$STACK_STATUS" = "ROLLBACK_COMPLETE" ]; then
              echo "Removing failed candidate stack before a clean retry. Previous failures:"
              aws cloudformation describe-stack-events --stack-name "$STACK_NAME" \
                --query "StackEvents[?ResourceStatus=='CREATE_FAILED'].[Timestamp,LogicalResourceId,ResourceType,ResourceStatusReason]" \
                --output table || true
              aws cloudformation delete-stack --stack-name "$STACK_NAME"
              aws cloudformation wait stack-delete-complete --stack-name "$STACK_NAME"
            fi
          fi
          if ! aws cloudformation describe-stacks --stack-name "$STACK_NAME" >/dev/null 2>&1; then
            for secret in "$PROJECT_NAME/lightsail/mysql" "$PROJECT_NAME/lightsail/runtime"; do
              if aws secretsmanager describe-secret --secret-id "$secret" >/dev/null 2>&1; then
                echo "Deleting orphaned candidate secret: $secret"
                aws secretsmanager delete-secret --secret-id "$secret" --force-delete-without-recovery >/dev/null
                for attempt in $(seq 1 30); do
                  if ! aws secretsmanager describe-secret --secret-id "$secret" >/dev/null 2>&1; then break; fi
                  sleep 2
                done
              fi
            done
          fi
          DB_BLUEPRINT_ID=$(aws lightsail get-relational-database-blueprints \
            --query "blueprints[?engine=='mysql'] | sort_by(@,&engineVersion)[-1].blueprintId" \
            --output text)
          test -n "$DB_BLUEPRINT_ID"
          INSTANCE_BUNDLE_ID=$(aws lightsail get-bundles --include-inactive \
            --query 'bundles[?isActive == `true` && ramSizeInGb == `1.0` && cpuCount == `2` && price == `7.0`].bundleId | [0]' \
            --output text)
          if [ -z "$INSTANCE_BUNDLE_ID" ] || [ "$INSTANCE_BUNDLE_ID" = "None" ]; then
            echo "No active 1 GB, 2-vCPU, USD 7 Lightsail bundle exists in $AWS_REGION. Refusing a costlier plan."
            aws lightsail get-bundles --include-inactive \
              --query 'bundles[?isActive == `true` && ramSizeInGb == `1.0`].[bundleId,cpuCount,ramSizeInGb,price]' \
              --output table
            exit 1
          fi
          echo "Using Lightsail MySQL blueprint: $DB_BLUEPRINT_ID"
          echo "Using Lightsail API bundle: $INSTANCE_BUNDLE_ID (1 GB, 2 vCPU, USD 7/month)"
          RUNNER_IP=$(curl -fsS https://checkip.amazonaws.com | tr -d '[:space:]')
          if ! [[ "$RUNNER_IP" =~ ^([0-9]{1,3}\.){3}[0-9]{1,3}$ ]]; then
            echo "Could not determine a valid GitHub runner IPv4 address."
            exit 1
          fi
          echo "Restricting deployment SSH access to the current GitHub runner."
          aws cloudformation deploy \
            --stack-name "$STACK_NAME" \
            --template-file infra/aws/lightsail-production.yaml \
            --capabilities CAPABILITY_NAMED_IAM \
            --no-fail-on-empty-changeset \
            --parameter-overrides \
              BudgetEmail='${{ inputs.budget_email }}' \
              RelationalDatabaseBlueprintId="$DB_BLUEPRINT_ID" \
              InstanceBundleId="$INSTANCE_BUNDLE_ID" \
              SshAllowedCidr="$RUNNER_IP/32" \
              EnableCloudFront='false' \
              InitialMediaBaseUrl='https://aws-origin.dekhocampus.com/storage/v1/object/public' \
              CorsOrigins='https://dekhocampus-aws-candidate.pages.dev,https://dekhocampus.com,https://www.dekhocampus.com'
          aws cloudformation describe-stacks --stack-name "$STACK_NAME" \
            --query 'Stacks[0].Outputs' --output json > /tmp/stack-outputs.json

      - name: Report infrastructure failure details
        if: ${{ failure() }}
        run: |
          aws cloudformation describe-stack-events --stack-name "$STACK_NAME" \
            --query "StackEvents[?ResourceStatus=='CREATE_FAILED' || ResourceStatus=='UPDATE_FAILED' || ResourceStatus=='ROLLBACK_FAILED'].[Timestamp,LogicalResourceId,ResourceType,ResourceStatus,ResourceStatusReason]" \
            --output table || true

      - name: Store runtime secrets in AWS Secrets Manager
        env:
          AUTH_JWT_SECRET: ${{ secrets.AUTH_JWT_SECRET }}
          SMS_FAST2SMS_API_KEY: ${{ secrets.SMS_FAST2SMS_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          CLARITY_DATA_EXPORT_TOKEN: ${{ secrets.CLARITY_DATA_EXPORT_TOKEN }}
          CLOUDFLARE_PAGES_DEPLOY_HOOK_URL: ${{ secrets.CLOUDFLARE_PAGES_DEPLOY_HOOK_URL }}
        run: |
          jq -n \
            --arg authJwtSecret "$AUTH_JWT_SECRET" \
            --arg smsFast2smsApiKey "$SMS_FAST2SMS_API_KEY" \
            --arg geminiApiKey "$GEMINI_API_KEY" \
            --arg openaiApiKey "$OPENAI_API_KEY" \
            --arg clarityDataExportToken "$CLARITY_DATA_EXPORT_TOKEN" \
            --arg cloudflarePagesDeployHookUrl "$CLOUDFLARE_PAGES_DEPLOY_HOOK_URL" \
            '{authJwtSecret:$authJwtSecret,smsFast2smsApiKey:$smsFast2smsApiKey,geminiApiKey:$geminiApiKey,openaiApiKey:$openaiApiKey,clarityDataExportToken:$clarityDataExportToken,cloudflarePagesDeployHookUrl:$cloudflarePagesDeployHookUrl}' \
            > /tmp/runtime-secret.json
          aws secretsmanager put-secret-value \
            --secret-id "$PROJECT_NAME/lightsail/runtime" \
            --secret-string file:///tmp/runtime-secret.json >/dev/null
          rm -f /tmp/runtime-secret.json

      - name: Prepare temporary SSH access
        run: |
          INSTANCE_NAME=$(jq -r '.[] | select(.OutputKey=="ApiInstanceName") | .OutputValue' /tmp/stack-outputs.json)
          API_IP=$(jq -r '.[] | select(.OutputKey=="ApiPublicIp") | .OutputValue' /tmp/stack-outputs.json)
          aws lightsail get-instance-access-details \
            --instance-name "$INSTANCE_NAME" \
            --protocol ssh \
            --output json > /tmp/lightsail-access.json
          jq -r '.accessDetails.privateKey' /tmp/lightsail-access.json > /tmp/tempkey
          jq -r '.accessDetails.certKey' /tmp/lightsail-access.json > /tmp/tempkey-cert.pub
          SSH_USER=$(jq -r '.accessDetails.username' /tmp/lightsail-access.json)
          SSH_IP=$(jq -r '.accessDetails.ipAddress' /tmp/lightsail-access.json)
          test -s /tmp/tempkey
          test -s /tmp/tempkey-cert.pub
          test -n "$SSH_USER"
          test -n "$SSH_IP"
          chmod 600 /tmp/tempkey
          chmod 644 /tmp/tempkey-cert.pub
          ssh-keygen -y -f /tmp/tempkey >/dev/null
          ssh-keygen -L -f /tmp/tempkey-cert.pub >/dev/null
          rm -f /tmp/lightsail-access.json
          printf 'INSTANCE_NAME=%s\nAPI_IP=%s\nSSH_IP=%s\nSSH_USER=%s\n' "$INSTANCE_NAME" "$API_IP" "$SSH_IP" "$SSH_USER" >> "$GITHUB_ENV"
          for attempt in $(seq 1 18); do
            if ssh -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=no -o ConnectTimeout=10 -i /tmp/tempkey "$SSH_USER@$SSH_IP" true; then
              ssh -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=no -i /tmp/tempkey "$SSH_USER@$SSH_IP" '
                if ! sudo timeout 120 cloud-init status --wait; then
                  sudo cloud-init status --long || true
                  sudo systemctl show cloud-final \
                    --property=ActiveState \
                    --property=SubState \
                    --property=Result \
                    --property=ExecMainStatus || true
                  if ! command -v nginx >/dev/null 2>&1 \
                    || ! command -v mysql >/dev/null 2>&1 \
                    || ! command -v node >/dev/null 2>&1 \
                    || ! command -v aws >/dev/null 2>&1 \
                    || ! sudo test -d /opt/dc-react/app/backend \
                    || ! sudo test -e /etc/nginx/sites-enabled/dc-react; then
                    install -m 600 /dev/null /tmp/dc-react-bootstrap.sh
                    sudo awk "length(\$0) > 1000 && \$0 ~ /^[A-Za-z0-9+\/=]+$/ { print; exit }" \
                      /var/lib/cloud/instance/scripts/part-001 | base64 --decode \
                      >/tmp/dc-react-bootstrap.sh || true
                    if ! test -s /tmp/dc-react-bootstrap.sh; then
                      sudo cp /var/lib/cloud/instance/scripts/part-001 /tmp/dc-react-bootstrap.sh
                      sudo chown "$USER:$USER" /tmp/dc-react-bootstrap.sh
                      chmod 600 /tmp/dc-react-bootstrap.sh
                    fi
                    sudo sed -E -i \
                      -e "s/(default-)*mysql-client/mysql-client/g" \
                      -e "s/apt-get( -o DPkg::Lock::Timeout=120)* update/apt-get -o DPkg::Lock::Timeout=120 update/g" \
                      -e "s/apt-get( -o DPkg::Lock::Timeout=120)* install/apt-get -o DPkg::Lock::Timeout=120 install/g" \
                      /tmp/dc-react-bootstrap.sh
                    install -m 600 /dev/null /tmp/dc-react-bootstrap-repair.log
                    if ! sudo timeout 900 bash /tmp/dc-react-bootstrap.sh \
                      >/tmp/dc-react-bootstrap-repair.log 2>&1; then
                      if ! command -v nginx >/dev/null 2>&1; then
                        grep -E "^(bash:|apt-get:|E:|Err:|W:|N:|Hit:|Get:|Ign:|Reading package|Building dependency|Package )" \
                          /tmp/dc-react-bootstrap-repair.log | tail -20 || true
                      fi
                      for command in curl git nginx mysql node npm aws jq pm2; do
                        if command -v "$command" >/dev/null 2>&1; then
                          echo "bootstrap-command:$command=ready"
                        else
                          echo "bootstrap-command:$command=missing"
                        fi
                      done
                      for path in /opt/dc-react/app /opt/dc-react/app/backend /etc/dc-react.env /etc/nginx/sites-enabled/dc-react; do
                        if sudo test -e "$path"; then
                          echo "bootstrap-path:$path=ready"
                        else
                          echo "bootstrap-path:$path=missing"
                        fi
                      done
                      rm -f /tmp/dc-react-bootstrap.sh
                      exit 1
                    fi
                    rm -f /tmp/dc-react-bootstrap.sh /tmp/dc-react-bootstrap-repair.log
                  fi
                fi
                command -v nginx >/dev/null
                command -v mysql >/dev/null
                command -v node >/dev/null
                command -v aws >/dev/null
                sudo test -d /opt/dc-react/app/backend
                sudo test -e /etc/nginx/sites-enabled/dc-react
              '
              exit 0
            fi
            sleep 10
          done
          exit 1

      - name: Install rotated application credentials
        run: |
          CREDENTIALS_SECRET=$(jq -r '.[] | select(.OutputKey=="ApplicationCredentialsSecretArn") | .OutputValue' /tmp/stack-outputs.json)
          test -n "$CREDENTIALS_SECRET"
          aws secretsmanager get-secret-value \
            --secret-id "$CREDENTIALS_SECRET" \
            --query SecretString \
            --output text > /tmp/application-credentials.json
          jq -e '.accessKeyId != "" and .secretAccessKey != ""' /tmp/application-credentials.json >/dev/null
          chmod 600 /tmp/application-credentials.json
          scp -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=no -i /tmp/tempkey \
            /tmp/application-credentials.json "$SSH_USER@$SSH_IP:/tmp/application-credentials.json"
          ssh -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=no -i /tmp/tempkey \
            "$SSH_USER@$SSH_IP" 'sudo bash -s' <<'REMOTE'
          set -euo pipefail
          ACCESS_KEY_ID=$(jq -r .accessKeyId /tmp/application-credentials.json)
          SECRET_ACCESS_KEY=$(jq -r .secretAccessKey /tmp/application-credentials.json)
          install -d -m 700 /root/.aws
          umask 077
          {
            printf '[default]\n'
            printf 'aws_access_key_id=%s\n' "$ACCESS_KEY_ID"
            printf 'aws_secret_access_key=%s\n' "$SECRET_ACCESS_KEY"
          } >/root/.aws/credentials
          ENV_FILE=$(mktemp)
          while IFS= read -r line; do
            case "$line" in
              AWS_ACCESS_KEY_ID=*) printf 'AWS_ACCESS_KEY_ID=%s\n' "$ACCESS_KEY_ID" ;;
              AWS_SECRET_ACCESS_KEY=*) printf 'AWS_SECRET_ACCESS_KEY=%s\n' "$SECRET_ACCESS_KEY" ;;
              *) printf '%s\n' "$line" ;;
            esac
          done </etc/dc-react.env >"$ENV_FILE"
          install -m 600 "$ENV_FILE" /etc/dc-react.env
          rm -f "$ENV_FILE" /tmp/application-credentials.json
          aws sts get-caller-identity >/dev/null
          REMOTE
          rm -f /tmp/application-credentials.json


      - name: Configure AWS runtime
        run: |
          MEDIA_BASE_URL=$(jq -r '.[] | select(.OutputKey=="MediaBaseUrl") | .OutputValue' /tmp/stack-outputs.json)
          BUCKET=$(jq -r '.[] | select(.OutputKey=="MediaBucketName") | .OutputValue' /tmp/stack-outputs.json)
          test -n "$MEDIA_BASE_URL"
          test -n "$BUCKET"
          ssh -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=no \
            -o ServerAliveInterval=30 -o ServerAliveCountMax=120 \
            -i /tmp/tempkey "$SSH_USER@$SSH_IP" \
            "sudo bash -s -- '$MEDIA_BASE_URL' '$BUCKET'" <<'REMOTE'
          set -euo pipefail
          MEDIA_BASE_URL="$1"
          BUCKET="$2"
          DB_SECRET=$(aws secretsmanager get-secret-value --secret-id dc-react/lightsail/mysql --query SecretString --output text)
          RUNTIME_SECRET=$(aws secretsmanager get-secret-value --secret-id dc-react/lightsail/runtime --query SecretString --output text)
          DB_HOST=$(aws lightsail get-relational-database --relational-database-name dc-react-mysql-lightsail --query 'relationalDatabase.masterEndpoint.address' --output text)
          DB_PORT=$(aws lightsail get-relational-database --relational-database-name dc-react-mysql-lightsail --query 'relationalDatabase.masterEndpoint.port' --output text)
          APP_ACCESS_KEY_ID=$(aws configure get aws_access_key_id)
          APP_SECRET_ACCESS_KEY=$(aws configure get aws_secret_access_key)
          test -n "$APP_ACCESS_KEY_ID"
          test -n "$APP_SECRET_ACCESS_KEY"
          ENV_FILE=$(mktemp)
          cat >"$ENV_FILE" <<ENV
          NODE_ENV=production
          NODE_OPTIONS=--max-old-space-size=640
          HOST=127.0.0.1
          PORT=8787
          DB_HOST=$DB_HOST
          DB_PORT=$DB_PORT
          DB_USER=$(jq -r .username <<<"$DB_SECRET")
          DB_PASSWORD=$(jq -r .password <<<"$DB_SECRET")
          DB_NAME=$(jq -r .database <<<"$DB_SECRET")
          AUTH_JWT_SECRET=$(jq -r .authJwtSecret <<<"$RUNTIME_SECRET")
          AWS_REGION=ap-south-1
          AWS_S3_BUCKET=$BUCKET
          AWS_ACCESS_KEY_ID=$APP_ACCESS_KEY_ID
          AWS_SECRET_ACCESS_KEY=$APP_SECRET_ACCESS_KEY
          MEDIA_BASE_URL=$MEDIA_BASE_URL
          MEDIA_BUCKET_PREFIXES=admin-uploads,ad-images,legacy-public-assets,study-material,user-documents
          SMS_FAST2SMS_API_KEY=$(jq -r .smsFast2smsApiKey <<<"$RUNTIME_SECRET")
          GEMINI_API_KEY=$(jq -r .geminiApiKey <<<"$RUNTIME_SECRET")
          OPENAI_API_KEY=$(jq -r .openaiApiKey <<<"$RUNTIME_SECRET")
          CLARITY_DATA_EXPORT_TOKEN=$(jq -r .clarityDataExportToken <<<"$RUNTIME_SECRET")
          CLOUDFLARE_PAGES_DEPLOY_HOOK_URL=$(jq -r .cloudflarePagesDeployHookUrl <<<"$RUNTIME_SECRET")
          CORS_ORIGIN=https://dekhocampus-aws-candidate.pages.dev,https://dekhocampus.com,https://www.dekhocampus.com
          STORAGE_MAX_UPLOAD_BYTES=20971520
          REQUEST_LOG=yes
          ENV
          install -m 600 "$ENV_FILE" /etc/dc-react.env
          rm -f "$ENV_FILE"
          cd /opt/dc-react/app
          git fetch origin main
          # This is a deployment checkout. Keep it identical to the approved
          # production branch even after an intentional force-with-lease rollback.
          git reset --hard origin/main
          npm --prefix backend ci
          npm --prefix backend run prisma:generate
          set -a
          source /etc/dc-react.env
          set +a
          npm --prefix backend run db:setup:runtime
          node backend/scripts/configure-production-site-integrations.mjs
          npm --prefix backend run db:normalize:media
          npm --prefix backend run verify:integrations
          pm2 reload dc-react-api --update-env
          pm2 save
          if ! command -v certbot >/dev/null 2>&1; then
            apt-get -o DPkg::Lock::Timeout=120 update
            apt-get -o DPkg::Lock::Timeout=120 install -y certbot python3-certbot-nginx
          fi
          sed -i -E 's/server_name [^;]*;/server_name aws-origin.dekhocampus.com ec2-3-7-27-134.ap-south-1.compute.amazonaws.com;/' /etc/nginx/sites-available/dc-react
          if ! grep -q 'Strict-Transport-Security' /etc/nginx/sites-available/dc-react; then
            sed -i '/add_header X-Content-Type-Options/i\          add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;' /etc/nginx/sites-available/dc-react
          fi
          if ! grep -q 'return 308 https://dekhocampus.com/;' /etc/nginx/sites-available/dc-react; then
            sed -i '/^[[:space:]]*location \/ {$/i\          location = / {\n            return 308 https://dekhocampus.com/;\n          }' /etc/nginx/sites-available/dc-react
          fi
          nginx -t
          systemctl reload nginx
          certbot --nginx \
            --domain aws-origin.dekhocampus.com \
            --non-interactive \
            --agree-tos \
            --email sunandgarg@gmail.com \
            --redirect \
            --keep-until-expiring
          systemctl enable --now certbot.timer
          for attempt in $(seq 1 30); do
            HEALTH=$(curl --fail --silent --show-error --max-time 10 https://aws-origin.dekhocampus.com/health || true)
            if jq -e '.ok == true and .database == "mysql" and .storage == "s3"' <<<"$HEALTH" >/dev/null 2>&1; then
              break
            fi
            [ "$attempt" -eq 30 ] && { echo "$HEALTH"; exit 1; }
            sleep 2
          done
          REMOTE

      - name: Revoke requested user sessions
        if: ${{ inputs.revoke_phone != '' }}
        env:
          REVOKE_PHONE: ${{ inputs.revoke_phone }}
        run: |
          echo "::add-mask::$REVOKE_PHONE"
          NORMALIZED=$(printf '%s' "$REVOKE_PHONE" | tr -cd '0-9')
          if [ "${#NORMALIZED}" -eq 12 ] && [[ "$NORMALIZED" == 91* ]]; then
            NORMALIZED="${NORMALIZED:2}"
          fi
          if ! [[ "$NORMALIZED" =~ ^[6-9][0-9]{9}$ ]]; then
            echo "The requested session-revocation phone is invalid."
            exit 1
          fi
          ssh -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=no -i /tmp/tempkey \
            "$SSH_USER@$SSH_IP" "sudo bash -s -- '$NORMALIZED'" <<'REMOTE'
          set -euo pipefail
          export REVOKE_PHONE="$1"
          set -a
          source /etc/dc-react.env
          set +a
          cd /opt/dc-react/app
          npm --prefix backend run revoke:user-sessions
          REMOTE

      - name: Repair listed production article covers
        if: ${{ inputs.repair_listed_article_covers }}
        run: |
          ssh -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=no -i /tmp/tempkey \
            "$SSH_USER@$SSH_IP" "sudo bash -s" <<'REMOTE'
          set -euo pipefail
          set -a
          source /etc/dc-react.env
          set +a
          cd /opt/dc-react/app
          npm --prefix backend run repair:listed-article-covers
          REMOTE

      - name: Publish build sitemap seed to private S3
        run: |
          aws lightsail get-instance-access-details \
            --instance-name "$INSTANCE_NAME" \
            --protocol ssh \
            --output json > /tmp/lightsail-access-refresh.json
          jq -r '.accessDetails.privateKey' /tmp/lightsail-access-refresh.json > /tmp/tempkey
          jq -r '.accessDetails.certKey' /tmp/lightsail-access-refresh.json > /tmp/tempkey-cert.pub
          SSH_USER=$(jq -r '.accessDetails.username' /tmp/lightsail-access-refresh.json)
          SSH_IP=$(jq -r '.accessDetails.ipAddress' /tmp/lightsail-access-refresh.json)
          chmod 600 /tmp/tempkey
          chmod 644 /tmp/tempkey-cert.pub
          rm -f /tmp/lightsail-access-refresh.json
          BUCKET=$(jq -r '.[] | select(.OutputKey=="MediaBucketName") | .OutputValue' /tmp/stack-outputs.json)
          test -n "$BUCKET"
          tar -czf /tmp/dc-sitemap-seed.tar.gz dist/sitemap.xml dist/sitemap-index.xml dist/sitemap-[0-9]*.xml
          scp -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=no -i /tmp/tempkey \
            /tmp/dc-sitemap-seed.tar.gz "$SSH_USER@$SSH_IP:/tmp/dc-sitemap-seed.tar.gz"
          ssh -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=no -i /tmp/tempkey \
            "$SSH_USER@$SSH_IP" "sudo bash -s -- '$BUCKET'" <<'REMOTE'
          set -euo pipefail
          BUCKET="$1"
          set -a
          source /etc/dc-react.env
          set +a
          WORK_DIR=$(mktemp -d)
          trap 'rm -rf "$WORK_DIR" /tmp/dc-sitemap-seed.tar.gz' EXIT
          tar -xzf /tmp/dc-sitemap-seed.tar.gz -C "$WORK_DIR"
          for file in "$WORK_DIR"/dist/sitemap.xml "$WORK_DIR"/dist/sitemap-index.xml "$WORK_DIR"/dist/sitemap-[0-9]*.xml; do
            test -s "$file"
            aws s3 cp "$file" "s3://$BUCKET/system-sitemaps/public/$(basename "$file")" \
              --content-type 'application/xml; charset=utf-8' \
              --cache-control 'public,max-age=300,must-revalidate' \
              --sse AES256
          done
          REMOTE
          rm -f /tmp/dc-sitemap-seed.tar.gz

      - name: Verify live AI blog agent and cover pipeline
        if: ${{ inputs.run_ai_smoke }}
        run: |
          ssh -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=no -i /tmp/tempkey \
            "$SSH_USER@$SSH_IP" "sudo bash -s" <<'REMOTE'
          set -euo pipefail
          set -a
          source /etc/dc-react.env
          set +a
          cd /opt/dc-react/app
          npm --prefix backend run verify:production-blog
          REMOTE

      - name: Publish complete MySQL sitemap generation
        run: |
          aws lightsail get-instance-access-details \
            --instance-name "$INSTANCE_NAME" \
            --protocol ssh \
            --output json > /tmp/lightsail-access-refresh.json
          jq -r '.accessDetails.privateKey' /tmp/lightsail-access-refresh.json > /tmp/tempkey
          jq -r '.accessDetails.certKey' /tmp/lightsail-access-refresh.json > /tmp/tempkey-cert.pub
          SSH_USER=$(jq -r '.accessDetails.username' /tmp/lightsail-access-refresh.json)
          SSH_IP=$(jq -r '.accessDetails.ipAddress' /tmp/lightsail-access-refresh.json)
          chmod 600 /tmp/tempkey
