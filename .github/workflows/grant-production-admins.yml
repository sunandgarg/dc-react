name: Grant production administrators

on:
  workflow_dispatch:
    inputs:
      admin_phones:
        description: Comma-separated Indian mobile numbers to grant the native admin role
        required: true
        type: string

permissions:
  contents: read
  id-token: write

jobs:
  grant-admins:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 15
    steps:
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION || 'ap-south-1' }}

      - name: Provision native administrators
        env:
          ADMIN_PHONES: ${{ inputs.admin_phones }}
          STACK: dc-react-production
          CLUSTER: dc-react-production
          SERVICE: dc-react-web-api
        run: |
          set -euo pipefail
          subnet_a="$(aws cloudformation describe-stack-resources --stack-name "$STACK" --logical-resource-id PublicSubnetA --query 'StackResources[0].PhysicalResourceId' --output text)"
          subnet_b="$(aws cloudformation describe-stack-resources --stack-name "$STACK" --logical-resource-id PublicSubnetB --query 'StackResources[0].PhysicalResourceId' --output text)"
          service_sg="$(aws cloudformation describe-stack-resources --stack-name "$STACK" --logical-resource-id ServiceSecurityGroup --query 'StackResources[0].PhysicalResourceId' --output text)"
          task_definition="$(aws ecs describe-services --cluster "$CLUSTER" --services "$SERVICE" --query 'services[0].taskDefinition' --output text)"
          script="$(cat <<'NODE'
          import { randomUUID } from 'node:crypto';
          import { prisma } from './src/db.mjs';

          const phones = String(process.env.ADMIN_PHONES || '')
            .split(',')
            .map((value) => `+91${value.replace(/\\D/g, '').slice(-10)}`)
            .filter((phone) => /^\\+91[6-9]\\d{9}$/.test(phone));
          if (!phones.length) throw new Error('At least one valid Indian mobile number is required');

          for (const phone of [...new Set(phones)]) {
            let user = await prisma.app_auth_users.findUnique({ where: { phone } });
            if (!user) user = await prisma.app_auth_users.create({
              data: { id: randomUUID(), phone, provider: 'phone', user_metadata: { provisioned_admin: true } },
            });
            const now = new Date();
            await prisma.$executeRawUnsafe(
              'INSERT INTO `profiles` (`id`,`user_id`,`phone`,`created_at`,`updated_at`) VALUES (?,?,?,?,?) ON DUPLICATE KEY UPDATE `phone`=VALUES(`phone`),`updated_at`=VALUES(`updated_at`)',
              user.id, user.id, phone, now, now,
            );
            const role = await prisma.user_roles.findFirst({ where: { user_id: user.id, role: 'admin' } });
            if (!role) await prisma.user_roles.create({ data: { id: randomUUID(), user_id: user.id, role: 'admin' } });
          }
          await prisma.$disconnect();
          console.log(JSON.stringify({ provisioned: phones.length, role: 'admin' }));
          NODE
          )"
          overrides="$(jq -cn --arg script "$script" --arg phones "$ADMIN_PHONES" '{containerOverrides:[{name:"api",command:["node","--input-type=module","-e",$script],environment:[{name:"ADMIN_PHONES",value:$phones}]}]}')"
          task_arn="$(aws ecs run-task \
            --cluster "$CLUSTER" \
            --task-definition "$task_definition" \
            --launch-type FARGATE \
            --network-configuration "awsvpcConfiguration={subnets=[$subnet_a,$subnet_b],securityGroups=[$service_sg],assignPublicIp=ENABLED}" \
            --overrides "$overrides" \
            --query 'tasks[0].taskArn' \
            --output text)"
          test -n "$task_arn" && test "$task_arn" != "None"
          aws ecs wait tasks-stopped --cluster "$CLUSTER" --tasks "$task_arn"
          exit_code="$(aws ecs describe-tasks --cluster "$CLUSTER" --tasks "$task_arn" --query 'tasks[0].containers[?name==`api`].exitCode | [0]' --output text)"
          test "$exit_code" = "0"
