name: AWS continue production rollback

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  rollback:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION || 'ap-south-1' }}

      - name: Restore stack updateability
        run: |
          aws cloudformation continue-update-rollback \
            --stack-name dc-react-production \
            --resources-to-skip Service
          aws cloudformation wait stack-update-rollback-complete \
            --stack-name dc-react-production
