AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: DekhoCampus Node/Prisma API backed by MySQL.

Parameters:
  DatabaseUrl:
    Type: String
    NoEcho: true
  SupabaseFunctionsFallbackUrl:
    Type: String
    Default: ''
  SupabasePublishableKey:
    Type: String
    NoEcho: true
    Default: ''
  CorsOrigin:
    Type: String
    Default: https://dekhocampus.com

Globals:
  Function:
    Runtime: nodejs20.x
    Timeout: 29
    MemorySize: 1024
    Environment:
      Variables:
        DATABASE_URL: !Ref DatabaseUrl
        SUPABASE_FUNCTIONS_FALLBACK_URL: !Ref SupabaseFunctionsFallbackUrl
        SUPABASE_PUBLISHABLE_KEY: !Ref SupabasePublishableKey
        CORS_ORIGIN: !Ref CorsOrigin

Resources:
  Api:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ../
      Handler: src/lambda.handler
      Events:
        Proxy:
          Type: HttpApi
          Properties:
            Path: /{proxy+}
            Method: ANY
        Health:
          Type: HttpApi
          Properties:
            Path: /health
            Method: GET

Outputs:
  ApiUrl:
    Description: Set this value as VITE_API_URL.
    Value: !Sub 'https://${ServerlessHttpApi}.execute-api.${AWS::Region}.amazonaws.com'
