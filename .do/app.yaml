name: dc-react
region: blr
alerts:
  - rule: DEPLOYMENT_FAILED
  - rule: DOMAIN_FAILED
ingress:
  rules:
    - component:
        name: api
      match:
        path:
          prefix: /v1
    - component:
        name: api
      match:
        path:
          prefix: /auth
    - component:
        name: api
      match:
        path:
          prefix: /storage
    - component:
        name: api
      match:
        path:
          prefix: /health
    - component:
        name: website
      match:
        path:
          prefix: /
services:
  - name: api
    git:
      repo_clone_url: https://github.com/sunandgarg/dc-react.git
      branch: main
    source_dir: /
    dockerfile_path: backend/Dockerfile
    http_port: 8787
    instance_count: 1
    instance_size_slug: apps-s-1vcpu-0.5gb
    health_check:
      http_path: /health
      initial_delay_seconds: 20
    envs:
      - key: NODE_ENV
        scope: RUN_TIME
        value: production
      - key: HOST
        scope: RUN_TIME
        value: 0.0.0.0
      - key: DATABASE_URL
        scope: RUN_TIME
        value: ${dc-react-mysql.DATABASE_PRIVATE_URL}
      - key: SUPABASE_STORAGE_URL
        scope: RUN_TIME
        value: https://kozdctbbvrnyddlftmvf.supabase.co
static_sites:
  - name: website
    git:
      repo_clone_url: https://github.com/sunandgarg/dc-react.git
      branch: main
    source_dir: /
    environment_slug: node-js
    build_command: npm ci && npm run build
    output_dir: dist
    catchall_document: index.html
    envs:
      - key: SITEMAP_API_URL
        scope: BUILD_TIME
        value: https://dekhocampus.com
      - key: VITE_SUPABASE_STORAGE_URL
        scope: BUILD_TIME
        value: https://kozdctbbvrnyddlftmvf.supabase.co
databases:
  - name: dc-react-mysql
    engine: MYSQL
    version: "8"
    production: true
    cluster_name: dc-react-mysql
    db_name: defaultdb
    db_user: doadmin
