AWSTemplateFormatVersion: '2010-09-09'
Description: Low-cost single-instance compute for DekhoCampus, retaining the existing private RDS database.

Parameters:
  ProjectName:
    Type: String
    Default: dc-react
    AllowedPattern: '[a-z0-9-]+'
  VpcId:
    Type: AWS::EC2::VPC::Id
  SubnetId:
    Type: AWS::EC2::Subnet::Id
  DatabaseAccessSecurityGroupId:
    Type: AWS::EC2::SecurityGroup::Id
  DatabaseHost:
    Type: String
  DatabaseSecretArn:
    Type: String
  RuntimeSecretArn:
    Type: String
  SmsSecretArn:
    Type: String
  ApiImageUri:
    Type: String
  WebImageUri:
    Type: String
  SupabaseStorageUrl:
    Type: String
  CorsOrigin:
    Type: String
    Default: https://dekhocampus.com,https://www.dekhocampus.com
  InstanceType:
    Type: String
    Default: t3a.micro
    AllowedValues: [t3a.micro, t3.micro, t3.small]
  LatestAmiId:
    Type: AWS::SSM::Parameter::Value<AWS::EC2::Image::Id>
    Default: /aws/service/ami-amazon-linux-latest/al2023-ami-kernel-default-x86_64

Resources:
  PublicSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Public HTTP for the low-cost application host
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          CidrIp: 0.0.0.0/0
      Tags:
        - Key: Name
          Value: !Sub '${ProjectName}-low-cost-web'

  InstanceRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub '${ProjectName}-low-cost-instance'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: {Service: ec2.amazonaws.com}
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AmazonSSMManagedInstanceCore
        - arn:aws:iam::aws:policy/AmazonEC2ContainerRegistryReadOnly
      Policies:
        - PolicyName: ReadApplicationSecrets
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: secretsmanager:GetSecretValue
                Resource: [!Ref DatabaseSecretArn, !Ref RuntimeSecretArn, !Ref SmsSecretArn]

  InstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      Roles: [!Ref InstanceRole]

  ApplicationInstance:
    Type: AWS::EC2::Instance
    Properties:
      ImageId: !Ref LatestAmiId
      InstanceType: !Ref InstanceType
      IamInstanceProfile: !Ref InstanceProfile
      SubnetId: !Ref SubnetId
      SecurityGroupIds:
        - !Ref PublicSecurityGroup
        - !Ref DatabaseAccessSecurityGroupId
      MetadataOptions:
        HttpEndpoint: enabled
        HttpTokens: required
      BlockDeviceMappings:
        - DeviceName: /dev/xvda
          Ebs:
            DeleteOnTermination: true
            Encrypted: true
            VolumeSize: 12
            VolumeType: gp3
      Tags:
        - Key: Name
          Value: !Sub '${ProjectName}-low-cost-production'
      UserData:
        Fn::Base64: !Sub |
          #!/bin/bash
          set -euo pipefail
          dnf install -y docker jq
          systemctl enable --now docker

          if [ ! -f /swapfile ]; then
            dd if=/dev/zero of=/swapfile bs=1M count=2048
            chmod 600 /swapfile
            mkswap /swapfile
            swapon /swapfile
            echo '/swapfile swap swap defaults 0 0' >> /etc/fstab
          fi

          install -d -m 700 /opt/dc-react
          cat > /opt/dc-react/nginx.conf <<'NGINX'
          server {
            listen 8080;
            server_name _;
            root /usr/share/nginx/html;
            index index.html;
            client_max_body_size 20m;
            gzip on;
            gzip_comp_level 6;
            gzip_min_length 1024;
            gzip_types application/javascript application/json application/xml image/svg+xml text/css text/plain;
            add_header Referrer-Policy "strict-origin-when-cross-origin" always;
            add_header X-Content-Type-Options "nosniff" always;
            add_header X-Frame-Options "SAMEORIGIN" always;
            location = /health {
              proxy_pass http://api:8787;
              proxy_set_header Host $host;
              proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
              proxy_set_header X-Forwarded-Proto $scheme;
            }
            location ~ ^/(v1|auth|storage)(/|$) {
              proxy_pass http://api:8787;
              proxy_http_version 1.1;
              proxy_request_buffering off;
              proxy_set_header Host $host;
              proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
              proxy_set_header X-Forwarded-Proto $scheme;
              proxy_set_header X-Request-Id $request_id;
            }
            location /assets/ {
              try_files $uri =404;
              add_header Cache-Control "public, max-age=31536000, immutable";
            }
            location = /index.html {
              add_header Cache-Control "no-cache, no-store, must-revalidate";
            }
            location / {
              try_files $uri $uri/ /index.html;
            }
          }
          NGINX

          cat > /opt/dc-react/deploy.sh <<'DEPLOY'
          #!/bin/bash
          set -euo pipefail
          exec 9>/var/lock/dc-react-deploy.lock
          flock 9
          AWS_REGION_VALUE='${AWS::Region}'
          API_IMAGE='${ApiImageUri}'
          WEB_IMAGE='${WebImageUri}'
          DB_SECRET_ARN='${DatabaseSecretArn}'
          RUNTIME_SECRET_ARN='${RuntimeSecretArn}'
          SMS_SECRET_ARN='${SmsSecretArn}'

          DB_JSON=$(aws secretsmanager get-secret-value --region "$AWS_REGION_VALUE" --secret-id "$DB_SECRET_ARN" --query SecretString --output text)
          RUNTIME_JSON=$(aws secretsmanager get-secret-value --region "$AWS_REGION_VALUE" --secret-id "$RUNTIME_SECRET_ARN" --query SecretString --output text)
          SMS_JSON=$(aws secretsmanager get-secret-value --region "$AWS_REGION_VALUE" --secret-id "$SMS_SECRET_ARN" --query SecretString --output text)
          umask 077
          {
            printf 'DB_USER=%s\n' "$(printf '%s' "$DB_JSON" | jq -r .username)"
            printf 'DB_PASSWORD=%s\n' "$(printf '%s' "$DB_JSON" | jq -r .password)"
            printf 'AUTH_JWT_SECRET=%s\n' "$(printf '%s' "$RUNTIME_JSON" | jq -r .authJwtSecret)"
            printf 'SUPABASE_STORAGE_SERVICE_KEY=%s\n' "$(printf '%s' "$RUNTIME_JSON" | jq -r .supabaseStorageServiceKey)"
            printf 'SMS_FAST2SMS_API_KEY=%s\n' "$(printf '%s' "$SMS_JSON" | jq -r .fast2smsApiKey)"
          } > /opt/dc-react/api.env

          REGISTRY=$(printf '%s' "$API_IMAGE" | cut -d/ -f1)
          aws ecr get-login-password --region "$AWS_REGION_VALUE" | docker login --username AWS --password-stdin "$REGISTRY"
          docker pull "$API_IMAGE"
          docker pull "$WEB_IMAGE"
          docker network inspect dc-react >/dev/null 2>&1 || docker network create dc-react
          docker rm -f dc-react-web dc-react-api >/dev/null 2>&1 || true
          docker run -d \
            --name dc-react-api \
            --restart unless-stopped \
            --network dc-react \
            --network-alias api \
            --memory 700m \
            --memory-swap 1536m \
            --env-file /opt/dc-react/api.env \
            -e NODE_ENV=production \
            -e HOST=0.0.0.0 \
            -e PORT=8787 \
            -e REQUEST_LOG=no \
            -e DB_HOST='${DatabaseHost}' \
            -e DB_PORT=3306 \
            -e DB_NAME=dc_react \
            -e DB_SSL_CA=global-bundle.pem \
            -e CORS_ORIGIN='${CorsOrigin}' \
            -e SUPABASE_STORAGE_URL='${SupabaseStorageUrl}' \
            -e STORAGE_MAX_UPLOAD_BYTES=20971520 \
            "$API_IMAGE" \
            sh -c 'npm run db:setup:runtime && exec node src/server.mjs'

          for attempt in $(seq 1 90); do
            if docker exec dc-react-api node -e "fetch('http://127.0.0.1:8787/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"; then
              break
            fi
            if [ "$attempt" -eq 90 ]; then
              docker logs dc-react-api --tail 200
              exit 1
            fi
            sleep 5
          done

          docker run -d \
            --name dc-react-web \
            --restart unless-stopped \
            --network dc-react \
            --memory 128m \
            --memory-swap 256m \
            -p 80:8080 \
            -v /opt/dc-react/nginx.conf:/etc/nginx/conf.d/default.conf:ro \
            "$WEB_IMAGE"
          for attempt in $(seq 1 30); do
            if curl --fail --silent --show-error http://127.0.0.1/health >/dev/null; then
              break
            fi
            if [ "$attempt" -eq 30 ]; then
              docker ps -a
              docker logs dc-react-web --tail 200
              exit 1
            fi
            sleep 2
          done
          docker image prune -af --filter until=168h
          DEPLOY
          chmod 700 /opt/dc-react/deploy.sh
          /opt/dc-react/deploy.sh > /var/log/dc-react-deploy.log 2>&1

  ApplicationAddress:
    Type: AWS::EC2::EIP
    Properties:
      Domain: vpc
      Tags:
        - Key: Name
          Value: !Sub '${ProjectName}-low-cost-production'

  AddressAssociation:
    Type: AWS::EC2::EIPAssociation
    Properties:
      AllocationId: !GetAtt ApplicationAddress.AllocationId
      InstanceId: !Ref ApplicationInstance

Outputs:
  ApplicationUrl:
    Value: !Sub 'http://${ApplicationAddress}'
  PublicIp:
    Value: !Ref ApplicationAddress
  InstanceId:
    Value: !Ref ApplicationInstance
