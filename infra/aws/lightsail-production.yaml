AWSTemplateFormatVersion: '2010-09-09'
Description: DekhoCampus low-cost production API, MySQL, private S3, and optional CloudFront.

Parameters:
  ProjectName:
    Type: String
    Default: dc-react
    AllowedPattern: '[a-z0-9-]+'
  RepositoryUrl:
    Type: String
    Default: https://github.com/sunandgarg/dc-react.git
  RepositoryBranch:
    Type: String
    Default: main
  CorsOrigins:
    Type: String
    Default: https://dekhocampus-aws-candidate.pages.dev,https://legacy.dekhocampus.com,https://dekhocampus.com,https://www.dekhocampus.com
  MediaDomain:
    Type: String
    Default: ''
  MediaCertificateArn:
    Type: String
    Default: ''
  BudgetEmail:
    Type: String
    AllowedPattern: '^[^@\s]+@[^@\s]+\.[^@\s]+$'
  RelationalDatabaseBlueprintId:
    Type: String
    Default: mysql_8_0
    AllowedPattern: '[a-z0-9_]+'
  InstanceBundleId:
    Type: String
    Default: micro_3_0
    AllowedPattern: '[a-z0-9_]+'
  EnableCloudFront:
    Type: String
    Default: 'true'
    AllowedValues: ['true', 'false']
  InitialMediaBaseUrl:
    Type: String
    Default: http://127.0.0.1/storage/v1/object/public

Conditions:
  UseCloudFront: !Equals [!Ref EnableCloudFront, 'true']
  HasMediaDomain: !And
    - !Condition UseCloudFront
    - !Not [!Equals [!Ref MediaDomain, '']]
    - !Not [!Equals [!Ref MediaCertificateArn, '']]

Resources:
  DatabaseSecret:
    Type: AWS::SecretsManager::Secret
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      Name: !Sub '${ProjectName}/lightsail/mysql'
      GenerateSecretString:
        SecretStringTemplate: '{"username":"dc_admin","database":"dc_react"}'
        GenerateStringKey: password
        PasswordLength: 32
        ExcludePunctuation: true

  RuntimeSecret:
    Type: AWS::SecretsManager::Secret
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      Name: !Sub '${ProjectName}/lightsail/runtime'
      GenerateSecretString:
        SecretStringTemplate: '{}'
        GenerateStringKey: authJwtSecret
        PasswordLength: 64
        ExcludePunctuation: true

  Database:
    Type: AWS::Lightsail::Database
    DeletionPolicy: Snapshot
    UpdateReplacePolicy: Snapshot
    Properties:
      RelationalDatabaseName: !Sub '${ProjectName}-mysql-lightsail'
      AvailabilityZone: ap-south-1a
      RelationalDatabaseBlueprintId: !Ref RelationalDatabaseBlueprintId
      RelationalDatabaseBundleId: micro_2_0
      MasterDatabaseName: dc_react
      MasterUsername: dc_admin
      MasterUserPassword: !Sub '{{resolve:secretsmanager:${DatabaseSecret}:SecretString:password}}'
      PubliclyAccessible: false
      BackupRetention: true
      PreferredBackupWindow: '20:30-21:00'
      PreferredMaintenanceWindow: 'sun:21:30-sun:22:00'
      RelationalDatabaseParameters:
        - ParameterName: character_set_server
          ParameterValue: utf8mb4
          ApplyMethod: pending-reboot
          IsModifiable: true
        - ParameterName: collation_server
          ParameterValue: utf8mb4_unicode_ci
          ApplyMethod: pending-reboot
          IsModifiable: true
      Tags:
        - Key: Project
          Value: !Ref ProjectName
        - Key: Environment
          Value: production

  MediaBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      VersioningConfiguration:
        Status: Enabled
      CorsConfiguration:
        CorsRules:
          - AllowedHeaders: ['content-type', 'x-amz-*']
            AllowedMethods: [GET, HEAD, PUT]
            AllowedOrigins: !Split [',', !Ref CorsOrigins]
            ExposedHeaders: [ETag]
            MaxAge: 3600
      LifecycleConfiguration:
        Rules:
          - Id: RetireOldVersions
            Status: Enabled
            NoncurrentVersionExpiration:
              NoncurrentDays: 30
      Tags:
        - Key: Project
          Value: !Ref ProjectName
        - Key: Environment
          Value: production

  CloudFrontOac:
    Type: AWS::CloudFront::OriginAccessControl
    Condition: UseCloudFront
    Properties:
      OriginAccessControlConfig:
        Name: !Sub '${ProjectName}-media-oac'
        Description: Private S3 access for DekhoCampus media
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  MediaDistribution:
    Type: AWS::CloudFront::Distribution
    Condition: UseCloudFront
    Properties:
      DistributionConfig:
        Enabled: true
        Comment: !Sub '${ProjectName} production media'
        HttpVersion: http2and3
        IPV6Enabled: true
        PriceClass: PriceClass_200
        Aliases: !If [HasMediaDomain, [!Ref MediaDomain], !Ref 'AWS::NoValue']
        ViewerCertificate: !If
          - HasMediaDomain
          - AcmCertificateArn: !Ref MediaCertificateArn
            SslSupportMethod: sni-only
            MinimumProtocolVersion: TLSv1.2_2021
          - CloudFrontDefaultCertificate: true
        Origins:
          - Id: private-media
            DomainName: !GetAtt MediaBucket.RegionalDomainName
            OriginAccessControlId: !Ref CloudFrontOac
            S3OriginConfig: {}
        DefaultCacheBehavior:
          TargetOriginId: private-media
          ViewerProtocolPolicy: redirect-to-https
          Compress: true
          AllowedMethods: [GET, HEAD, OPTIONS]
          CachedMethods: [GET, HEAD, OPTIONS]
          CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6
          ResponseHeadersPolicyId: 67f7725c-6f97-4210-82d7-5512b31e9d03
      Tags:
        - Key: Project
          Value: !Ref ProjectName

  MediaBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref MediaBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - !If
            - UseCloudFront
            - Sid: AllowCloudFrontReadOnly
              Effect: Allow
              Principal:
                Service: cloudfront.amazonaws.com
              Action: s3:GetObject
              Resource: !Sub '${MediaBucket.Arn}/*'
              Condition:
                StringEquals:
                  AWS:SourceArn: !Sub 'arn:${AWS::Partition}:cloudfront::${AWS::AccountId}:distribution/${MediaDistribution}'
            - !Ref 'AWS::NoValue'
          - Sid: RequireTls
            Effect: Deny
            Principal: '*'
            Action: s3:*
            Resource:
              - !GetAtt MediaBucket.Arn
              - !Sub '${MediaBucket.Arn}/*'
            Condition:
              Bool:
                aws:SecureTransport: false

  ApplicationUser:
    Type: AWS::IAM::User
    Properties:
      UserName: !Sub '${ProjectName}-lightsail-api'
      Policies:
        - PolicyName: ApplicationMediaAndBootstrap
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: [s3:ListBucket]
                Resource: !GetAtt MediaBucket.Arn
              - Effect: Allow
                Action: [s3:GetObject, s3:PutObject, s3:DeleteObject]
                Resource: !Sub '${MediaBucket.Arn}/*'
              - Effect: Allow
                Action: [secretsmanager:GetSecretValue]
                Resource: [!Ref DatabaseSecret, !Ref RuntimeSecret]
              - Effect: Allow
                Action: [lightsail:GetRelationalDatabase]
                Resource: '*'

  ApplicationAccessKey:
    Type: AWS::IAM::AccessKey
    Properties:
      UserName: !Ref ApplicationUser

  ApiInstance:
    Type: AWS::Lightsail::Instance
    DependsOn: Database
    Properties:
      InstanceName: !Sub '${ProjectName}-api-lightsail'
      AvailabilityZone: ap-south-1a
      BlueprintId: ubuntu_24_04
      BundleId: !Ref InstanceBundleId
      Networking:
        Ports:
          - AccessDirection: inbound
            AccessFrom: anywhere
            AccessType: Public
            CommonName: SSH
            FromPort: 22
            ToPort: 22
            Protocol: tcp
          - AccessDirection: inbound
            AccessFrom: anywhere
            AccessType: Public
            CommonName: HTTP
            FromPort: 80
            ToPort: 80
            Protocol: tcp
          - AccessDirection: inbound
            AccessFrom: anywhere
            AccessType: Public
            CommonName: HTTPS
            FromPort: 443
            ToPort: 443
            Protocol: tcp
      UserData:
        Fn::Base64: !Sub |
          #!/usr/bin/env bash
          set -euo pipefail
          export DEBIAN_FRONTEND=noninteractive
          apt-get update
          apt-get install -y ca-certificates curl git nginx default-mysql-client unzip jq
          curl -fsSL https://deb.nodesource.com/setup_22.x | bash -
          apt-get install -y nodejs
          npm install -g pm2
          fallocate -l 1G /swapfile
          chmod 600 /swapfile
          mkswap /swapfile
          swapon /swapfile
          echo '/swapfile none swap sw 0 0' >> /etc/fstab
          sysctl vm.swappiness=10
          curl -fsSL https://awscli.amazonaws.com/awscli-exe-linux-x86_64.zip -o /tmp/awscliv2.zip
          unzip -q /tmp/awscliv2.zip -d /tmp
          /tmp/aws/install
          install -d -m 700 /root/.aws /opt/${ProjectName}
          cat >/root/.aws/credentials <<'CREDS'
          [default]
          aws_access_key_id=${ApplicationAccessKey}
          aws_secret_access_key=${ApplicationAccessKey.SecretAccessKey}
          CREDS
          chmod 600 /root/.aws/credentials
          aws configure set region ${AWS::Region}
          DB_HOST=$(aws lightsail get-relational-database --relational-database-name ${ProjectName}-mysql-lightsail --query 'relationalDatabase.masterEndpoint.address' --output text)
          DB_PORT=$(aws lightsail get-relational-database --relational-database-name ${ProjectName}-mysql-lightsail --query 'relationalDatabase.masterEndpoint.port' --output text)
          DB_SECRET=$(aws secretsmanager get-secret-value --secret-id '${DatabaseSecret}' --query SecretString --output text)
          RUNTIME_SECRET=$(aws secretsmanager get-secret-value --secret-id '${RuntimeSecret}' --query SecretString --output text)
          git clone --branch '${RepositoryBranch}' --depth 1 '${RepositoryUrl}' /opt/${ProjectName}/app
          cd /opt/${ProjectName}/app
          npm --prefix backend ci
          npm --prefix backend run prisma:generate
          cat >/etc/${ProjectName}.env <<ENV
          NODE_ENV=production
          NODE_OPTIONS=--max-old-space-size=640
          HOST=127.0.0.1
          PORT=8787
          DB_HOST=$DB_HOST
          DB_PORT=$DB_PORT
          DB_USER=$(jq -r .username <<<"$DB_SECRET")
          DB_PASSWORD=$(jq -r .password <<<"$DB_SECRET")
          DB_NAME=$(jq -r .database <<<"$DB_SECRET")
          AUTH_JWT_SECRET=$(jq -r .authJwtSecret <<<"$RUNTIME_SECRET")
          AWS_REGION=${AWS::Region}
          AWS_S3_BUCKET=${MediaBucket}
          AWS_ACCESS_KEY_ID=${ApplicationAccessKey}
          AWS_SECRET_ACCESS_KEY=${ApplicationAccessKey.SecretAccessKey}
          MEDIA_BASE_URL=${InitialMediaBaseUrl}
          CLOUDFLARE_PAGES_DEPLOY_HOOK_URL=$(jq -r '.cloudflarePagesDeployHookUrl // empty' <<<"$RUNTIME_SECRET")
          CORS_ORIGIN=${CorsOrigins}
          STORAGE_MAX_UPLOAD_BYTES=20971520
          REQUEST_LOG=yes
          ENV
          chmod 600 /etc/${ProjectName}.env
          cd backend
          set -a
          source /etc/${ProjectName}.env
          set +a
          npm run db:setup:runtime
          pm2 start src/server.mjs --name ${ProjectName}-api --max-memory-restart 720M
          pm2 save
          pm2 startup systemd -u root --hp /root | tail -1 | bash || true
          cat >/etc/nginx/sites-available/${ProjectName} <<'NGINX'
          limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=10r/m;
          server {
            listen 80 default_server;
            listen [::]:80 default_server;
          server_name _;
          client_max_body_size 21m;
          server_tokens off;
          gzip on;
          gzip_types application/json application/javascript text/css text/plain;
          add_header X-Content-Type-Options nosniff always;
          add_header Referrer-Policy strict-origin-when-cross-origin always;
          add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
            location ~ ^/(auth|v1/functions/send-otp|v1/functions/phone-auth) {
              limit_req zone=auth_limit burst=10 nodelay;
              proxy_pass http://127.0.0.1:8787;
              proxy_set_header Host $host;
              proxy_set_header X-Real-IP $remote_addr;
              proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
              proxy_set_header X-Forwarded-Proto $scheme;
            }
            location / {
              proxy_pass http://127.0.0.1:8787;
              proxy_http_version 1.1;
              proxy_set_header Host $host;
              proxy_set_header X-Real-IP $remote_addr;
              proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
              proxy_set_header X-Forwarded-Proto $scheme;
              proxy_read_timeout 120s;
              proxy_send_timeout 120s;
            }
          }
          NGINX
          rm -f /etc/nginx/sites-enabled/default
          ln -sf /etc/nginx/sites-available/${ProjectName} /etc/nginx/sites-enabled/${ProjectName}
          nginx -t
          systemctl restart nginx

      Tags:
        - Key: Project
          Value: !Ref ProjectName
        - Key: Environment
          Value: production

  ApiStaticIp:
    Type: AWS::Lightsail::StaticIp
    Properties:
      StaticIpName: !Sub '${ProjectName}-api-ip'
      AttachedTo: !Ref ApiInstance

  CpuAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub '${ProjectName}-lightsail-high-cpu'
      Namespace: AWS/Lightsail
      MetricName: CPUUtilization
      Dimensions:
        - Name: InstanceName
          Value: !Sub '${ProjectName}-api-lightsail'
      Statistic: Average
      Period: 300
      EvaluationPeriods: 3
      Threshold: 80
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: missing

  MonthlyBudget:
    Type: AWS::Budgets::Budget
    Properties:
      Budget:
        BudgetName: !Sub '${ProjectName}-monthly-production'
        BudgetLimit:
          Amount: 25
          Unit: USD
        BudgetType: COST
        TimeUnit: MONTHLY
      NotificationsWithSubscribers:
        - Notification:
            ComparisonOperator: GREATER_THAN
            NotificationType: ACTUAL
            Threshold: 22
            ThresholdType: ABSOLUTE_VALUE
          Subscribers:
            - Address: !Ref BudgetEmail
              SubscriptionType: EMAIL
        - Notification:
            ComparisonOperator: GREATER_THAN
            NotificationType: ACTUAL
            Threshold: 25
            ThresholdType: ABSOLUTE_VALUE
          Subscribers:
            - Address: !Ref BudgetEmail
              SubscriptionType: EMAIL
        - Notification:
            ComparisonOperator: GREATER_THAN
            NotificationType: FORECASTED
            Threshold: 25
            ThresholdType: ABSOLUTE_VALUE
          Subscribers:
            - Address: !Ref BudgetEmail
              SubscriptionType: EMAIL

Outputs:
  ApiPublicIp:
    Value: !GetAtt ApiStaticIp.IpAddress
  ApiInstanceName:
    Value: !Sub '${ProjectName}-api-lightsail'
  DatabaseName:
    Value: !Sub '${ProjectName}-mysql-lightsail'
  MediaBucketName:
    Value: !Ref MediaBucket
  MediaBaseUrl:
    Value: !If
      - UseCloudFront
      - !Sub 'https://${MediaDistribution.DomainName}'
      - !Sub 'http://${ApiStaticIp.IpAddress}/storage/v1/object/public'
  MediaDistributionId:
    Condition: UseCloudFront
    Value: !Ref MediaDistribution
  MediaDistributionDomain:
    Condition: UseCloudFront
    Value: !GetAtt MediaDistribution.DomainName
  ApplicationAccessKeyId:
    Value: !Ref ApplicationAccessKey
